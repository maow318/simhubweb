<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>初始化 · SIMHUB Web</title>
<style nonce="{{ csp_nonce() }}">
:root{color-scheme:light;--bg:#eef3f7;--card:rgba(255,255,255,.68);--text:#172033;--sub:#667085;--line:rgba(255,255,255,.5);--accent:#2f6df6;--accent2:#14b8a6;--accent3:#f97378;--accent-weak:rgba(47,109,246,.16);--danger:#ef4444;--ok:#16a34a;--shadow:0 24px 70px rgba(31,45,70,.18),inset 0 1px 0 rgba(255,255,255,.68);--ring:0 0 0 4px var(--accent-weak);--t:.18s cubic-bezier(.4,0,.2,1)}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#090d14;--card:rgba(20,27,39,.72);--text:#f7f8fb;--sub:#a6afbf;--line:rgba(255,255,255,.13);--accent:#7aa2ff;--accent2:#2dd4bf;--accent3:#fb7185;--accent-weak:rgba(122,162,255,.22);--shadow:0 28px 84px rgba(0,0,0,.56),inset 0 1px 0 rgba(255,255,255,.1)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:
  linear-gradient(135deg,rgba(255,255,255,.96),rgba(232,240,248,.9) 31%,rgba(240,248,246,.92) 64%,rgba(238,241,250,.96)),
  linear-gradient(112deg,rgba(47,109,246,.16),rgba(47,109,246,0) 43%),
  linear-gradient(306deg,rgba(20,184,166,.14),rgba(20,184,166,0) 48%),
  var(--bg);background-attachment:fixed;color:var(--text);letter-spacing:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(255,255,255,.14) 0 1px,transparent 1px 78px),repeating-linear-gradient(0deg,rgba(255,255,255,.12) 0 1px,transparent 1px 72px);mask-image:linear-gradient(to bottom,rgba(0,0,0,.62),rgba(0,0,0,.18));opacity:.42}
@media (prefers-color-scheme:dark){body{background:linear-gradient(135deg,rgba(11,15,23,.98),rgba(18,24,36,.96) 35%,rgba(10,28,31,.94) 68%,rgba(16,18,28,.98)),linear-gradient(112deg,rgba(122,162,255,.16),rgba(122,162,255,0) 43%),linear-gradient(306deg,rgba(45,212,191,.12),rgba(45,212,191,0) 48%),var(--bg)}body:before{opacity:.18}}
.loginCard{position:relative;z-index:1;background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);backdrop-filter:blur(26px) saturate(155%);padding:34px 28px;width:100%;max-width:390px}
.logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--accent2) 56%,var(--accent3));display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:#fff;font-size:30px;font-weight:800;overflow:hidden;box-shadow:0 16px 34px rgba(47,109,246,.25),inset 0 1px 0 rgba(255,255,255,.5)}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
h1{font-size:22px;margin:0 0 4px;text-align:center;font-weight:800;letter-spacing:0}
.subtitle{color:var(--sub);font-size:13px;text-align:center;margin:0 0 22px;line-height:1.5}
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px}
input{font:inherit;width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.48);color:var(--text);outline:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.5);backdrop-filter:blur(14px) saturate(140%);transition:border-color var(--t),box-shadow var(--t),background var(--t)}
input:focus{border-color:var(--accent);box-shadow:var(--ring)}
button{font:inherit;width:100%;margin-top:8px;cursor:pointer;border:1px solid rgba(255,255,255,.22);border-radius:13px;padding:12px;background:linear-gradient(135deg,var(--accent),#45a7ff);color:#fff;font-weight:700;font-size:15px;letter-spacing:0;box-shadow:0 12px 28px rgba(47,109,246,.24),inset 0 1px 0 rgba(255,255,255,.28);transition:filter var(--t),transform var(--t),box-shadow var(--t)}
button:hover{filter:brightness(1.06)}
button:focus-visible{outline:none;box-shadow:var(--ring)}
button:active{transform:scale(.98)}
.flash{font-size:13px;border-radius:11px;padding:10px 12px;margin-bottom:13px}
.flash.error{background:rgba(255,59,48,.14);color:var(--danger)}
.flash.success{background:rgba(52,199,89,.16);color:var(--ok)}
</style>
</head>
<body>
<form class="loginCard" method="post">
  <div class="logo"><img src="/static/app-icon.jpg" alt="esimSubscription"></div>
  <h1>创建管理员</h1>
  <p class="subtitle">首次进入需要创建一个本地管理员账号，密码会加密保存在 SQLite 数据库里。</p>
  <div id="flashHost"></div>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field">
    <label>用户名</label>
    <input name="username" value="admin" autocomplete="username" required>
  </div>
  <div class="field">
    <label>密码</label>
    <input name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="至少 8 位">
  </div>
  <div class="field">
    <label>确认密码</label>
    <input name="confirm" type="password" autocomplete="new-password" required minlength="8">
  </div>
  <button type="submit">创建并继续</button>
</form>
<script nonce="{{ csp_nonce() }}">
const FLASHES=[{% for category, message in get_flashed_messages(with_categories=true) %}["{{ category }}",{{ message|tojson }}],{% endfor %}];
const host=document.getElementById("flashHost");
FLASHES.forEach(([c,m])=>{const d=document.createElement("div");d.className="flash "+c;d.textContent=m;host.appendChild(d);});
</script>
</body>
</html>
