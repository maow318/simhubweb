<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIMHUB Web 管理</title>
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --card2:#fbfbfd; --text:#1d1d1f; --sub:#86868b; --line:#e5e5ea;
  --accent:#0a84ff; --accent-weak:rgba(10,132,255,.12); --danger:#ff3b30; --ok:#34c759; --warn:#ff9500;
  --radius:18px; --radius-sm:12px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
  --shadow-lg:0 1px 2px rgba(0,0,0,.04),0 12px 28px rgba(0,0,0,.08);
  --ring:0 0 0 4px var(--accent-weak); --t:.18s cubic-bezier(.4,0,.2,1);
  --sidebar:#ffffff;
}
.dark{
  --bg:#000000; --card:#1c1c1e; --card2:#161618; --text:#f5f5f7; --sub:#98989d; --line:#2c2c2e;
  --accent-weak:rgba(10,132,255,.22);
  --shadow:0 1px 2px rgba(0,0,0,.5); --shadow-lg:0 12px 28px rgba(0,0,0,.6); --sidebar:#0e0e10;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);letter-spacing:-.011em;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
.hidden{display:none!important}
button{font:inherit;cursor:pointer;border:none;border-radius:12px;padding:9px 15px;background:var(--accent);color:#fff;font-weight:600;letter-spacing:-.01em;transition:filter var(--t),transform var(--t),box-shadow var(--t),background var(--t)}
button:hover{filter:brightness(1.06)}
button:active{transform:scale(.97)}
button:focus-visible{outline:none;box-shadow:var(--ring)}
button.sec{background:var(--card);color:var(--text);border:1px solid var(--line);filter:none}
button.sec:hover{background:var(--line);filter:none}
button.danger{background:var(--danger)}
button.ghost{background:transparent;color:var(--text)}
button.ghost:hover{background:var(--line);filter:none}
button:disabled{opacity:.5;cursor:default;transform:none;filter:none}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--text);outline:none;transition:border-color var(--t),box-shadow var(--t)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:var(--ring)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;background:transparent;color:var(--sub);padding:0;transition:background var(--t),color var(--t)}
.iconbtn:hover{background:var(--line);color:var(--text)}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* 登录 */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.loginCard{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:34px 28px;width:100%;max-width:360px;text-align:center}
.logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#0a84ff,#5ac8fa);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:#fff;font-size:30px;font-weight:700}
.codeInput{letter-spacing:10px;text-align:center;font-size:26px;font-weight:700;margin:18px 0}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-top:8px}

/* 框架 */
#app{display:flex;min-height:100vh}
#sidebar{width:220px;background:var(--sidebar);border-right:1px solid var(--line);padding:18px 12px;flex-shrink:0;position:sticky;top:0;height:100vh}
.brandRow{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
.brandRow .logo{width:32px;height:32px;border-radius:9px;font-size:17px;margin:0}
.brandRow b{font-size:16px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--text);cursor:pointer;font-size:15px;font-weight:500;transition:background var(--t),color var(--t)}
.nav a.active{background:var(--accent);color:#fff;box-shadow:0 2px 8px var(--accent-weak)}
.nav a:not(.active):hover{background:var(--line)}
#content{flex:1;min-width:0;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 22px}
header h1{font-size:18px;margin:0;font-weight:600;letter-spacing:-.02em}
header .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
header .spacer{flex:1}
header .meta{font-size:12px;color:var(--sub)}
main{padding:22px;max-width:1180px;width:100%}

.statgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;border:1px solid var(--line);transition:transform var(--t),box-shadow var(--t)}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.stat .n{font-size:30px;font-weight:700;letter-spacing:-.02em}
.stat .l{color:var(--sub);font-size:13px;margin-top:2px}
.stat.warn .n{color:var(--warn)} .stat.danger .n{color:var(--danger)}
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);padding:18px;margin-top:18px}
.panel h3{margin:0 0 14px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.bar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.bar .track{flex:1;height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:6px}
.recent{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.recent:last-child{border:none}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.toolbar input,.toolbar select{max-width:200px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;border:1px solid var(--line);position:relative;cursor:pointer;transition:transform var(--t),box-shadow var(--t),border-color var(--t)}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.card.sel:hover{box-shadow:0 0 0 2px var(--accent) inset,var(--shadow-lg)}
.card .flag{font-size:26px}
.card h3{margin:6px 0 2px;font-size:16px;font-weight:600;letter-spacing:-.01em}
.card .sub{color:var(--sub);font-size:13px}
.card .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--sub)}
.phone{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
.badge.exp{background:rgba(255,59,48,.15);color:var(--danger)}
.badge.soon{background:rgba(255,149,0,.15);color:var(--warn)}
.selcheck{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.card.sel .selcheck{background:var(--accent);border-color:var(--accent);color:#fff}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;justify-content:flex-end;z-index:20}
.drawer{width:min(460px,100%);height:100%;background:var(--bg);overflow:auto;padding:20px;animation:slide .25s ease}
@keyframes slide{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px}
.drawerActions{display:flex;gap:10px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);padding:11px 18px;border-radius:24px;font-size:14px;z-index:30;animation:toastUp .25s cubic-bezier(.4,0,.2,1)}
@keyframes toastUp{from{transform:translate(-50%,12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:34px;text-align:center;color:var(--sub)}
.drop.over{border-color:var(--accent);color:var(--accent)}
#menuBtn{display:none}
@media(max-width:760px){
  #sidebar{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:.25s;box-shadow:var(--shadow)}
  #sidebar.open{transform:none}
  #menuBtn{display:inline-flex}
  header{backdrop-filter:none;background:var(--card)}  /* 手机端关掉毛玻璃,避免 Safari 卡顿 */
  .scrim{justify-content:stretch}
  .drawer{width:100%;-webkit-overflow-scrolling:touch}
}
.secLabel{font-size:13px;font-weight:700;color:var(--sub);margin:18px 0 8px;text-transform:none}
.two{display:flex;gap:10px}
.pickRow{width:100%;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  color:var(--text);border-radius:11px;padding:11px 13px;font-weight:500;cursor:pointer;text-align:left;transition:border-color var(--t),background var(--t)}
.pickRow:hover{border-color:var(--accent)}
.pickRow .ph{color:var(--sub)}
.pickRow .chev{margin-left:auto;color:var(--sub);font-size:20px}
.appicon{width:34px;height:34px;border-radius:8px;object-fit:cover;background:var(--line)}
.durs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dur{background:var(--card);border:1px solid var(--line);color:var(--text);font-weight:600;padding:9px;transition:background var(--t),color var(--t),border-color var(--t)}
.dur:hover{border-color:var(--accent);color:var(--accent)}
.dur:active{background:var(--accent);color:#fff;border-color:var(--accent)}
.ltrow{display:flex;align-items:center;justify-content:space-between}
.ltrow input{width:auto}
.summary{font-size:13px;color:var(--sub);text-align:center;margin:6px 0 4px}
.picker{justify-content:center;align-items:center;z-index:50}
.pickerBox{background:var(--bg);width:min(440px,94vw);max-height:80vh;border-radius:18px;display:flex;flex-direction:column;overflow:hidden;padding:16px}
.pickerHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.pickerHead b{font-size:17px}
.pickerList{overflow:auto;margin-top:10px;-webkit-overflow-scrolling:touch}
.pkItem{display:flex;align-items:center;gap:12px;padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px;transition:background var(--t)}
.pkItem:hover{background:var(--line)}
.pkItem .sub{font-size:12px;color:var(--sub)}
.confirm{justify-content:center;align-items:center;z-index:60}
.confirmBox{background:var(--card);width:min(340px,90vw);border-radius:20px;padding:24px 22px;text-align:center;box-shadow:var(--shadow)}
.confirmBox .ic{width:54px;height:54px;border-radius:50%;background:rgba(255,59,48,.14);color:var(--danger);
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:24px}
.confirmBox h3{margin:0 0 6px;font-size:18px}
.confirmBox p{margin:0 0 18px;color:var(--sub);font-size:14px;line-height:1.5}
.confirmActions{display:flex;gap:10px}
.confirmActions button{flex:1;padding:12px}
.logo{overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.setlist{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-top:14px}
.setRow{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background var(--t)}
.setRow:last-child{border-bottom:none}
.setRow:hover{background:var(--line)}
.setRow .rt{flex:1;min-width:0}
.setRow .rt b{font-size:15px;font-weight:500;letter-spacing:-.01em}
.setRow .rt span{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.setRow .chev{color:var(--sub);font-size:20px;line-height:1}
.setRow.danger .rt b{color:var(--danger)}
.setRow input[type=checkbox]{width:auto}
.subhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.subhead h2{font-size:20px;margin:0;font-weight:600;letter-spacing:-.02em}
.subhead .iconbtn{width:34px;height:34px}
.card.hasbg h3{color:var(--text)}
.card.hasbg .sub,.card.hasbg .row{color:var(--sub)}
.card-bg{position:absolute;inset:0;background-size:cover;background-position:center right;z-index:0}
.card-shade{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(255,255,255,.95) 0%,rgba(255,255,255,.78) 38%,rgba(255,255,255,.22) 68%,rgba(255,255,255,0) 100%)}
.dark .card-shade{background:linear-gradient(90deg,rgba(18,18,20,.95) 0%,rgba(18,18,20,.78) 38%,rgba(18,18,20,.24) 68%,rgba(18,18,20,0) 100%)}
.card.hasbg>*:not(.card-bg):not(.card-shade):not(.moreBtn):not(.selcheck){position:relative;z-index:2}
.card.hasbg .selcheck{z-index:3}
.card-bg{background-color:var(--line)}
.moreBtn{position:absolute;top:8px;right:8px;font-size:20px;line-height:1;z-index:3}
.card:not(.hasbg) .moreBtn{color:var(--sub)}
.card.hasbg .moreBtn{color:#fff;background:rgba(0,0,0,.3)}
.card.hasbg .moreBtn:hover{background:rgba(0,0,0,.45)}
.detailHead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.detailHead h2{font-size:20px;letter-spacing:-.02em}
.dRow{display:flex;justify-content:space-between;gap:16px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14px}
.dRow .dL{color:var(--sub);flex-shrink:0}
.dRow .dV{text-align:right;word-break:break-all}

</style>
</head>
<body>

<section id="login" class="hidden">
  <div class="loginCard">
    <div class="logo">S</div>
    <h2 style="margin:0 0 4px">SIMHUB Web 管理</h2>
    <p style="color:var(--sub);font-size:13px">输入 App 中显示的 6 位连接码</p>
    <input id="codeInput" class="codeInput" inputmode="numeric" maxlength="6" placeholder="000000">
    <button id="loginBtn" style="width:100%">连接</button>
    <div id="loginErr" class="err"></div>
  </div>
</section>

<div id="app">
  <aside id="sidebar">
    <div class="brandRow"><div class="logo">S</div><b>SIMHUB</b></div>
    <nav class="nav" id="nav">
      <a data-v="overview" class="active">📊 概览</a>
      <a data-v="cards">💳 卡片管理</a>
      <a data-v="io">📂 导入与导出</a>
      <a data-v="settings">⚙️ 设置</a>
    </nav>
  </aside>
  <div id="content">
    <header>
      <button id="menuBtn" class="iconbtn" onclick="document.getElementById('sidebar').classList.toggle('open')"><svg><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <h1 id="pageTitle">概览</h1>
      <span class="dot"></span>
      <span class="spacer"></span>
      <span id="deviceMeta" class="meta"></span>
      <button class="iconbtn" id="themeBtn" title="深色/浅色"><svg id="themeIcon"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4" y1="4" x2="6" y2="6"/><line x1="18" y1="18" x2="20" y2="20"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4" y1="20" x2="6" y2="18"/><line x1="18" y1="6" x2="20" y2="4"/></svg></button>
      <button class="sec" id="logoutBtn">断开连接</button>
    </header>
    <main id="main"></main>
  </div>
</div>

<div id="drawerHost"></div>
<div id="pickerHost"></div>
<div id="confirmHost"></div>
<div id="toastHost"></div>

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.getElementById('toastHost').appendChild(t);setTimeout(()=>t.remove(),1800);}
/* 删除确认弹窗(替代浏览器原生 confirm) */
function confirmDelete(message,onConfirm,confirmText='删除'){
  const host=document.getElementById('confirmHost');
  host.innerHTML=`<div class="scrim confirm"><div class="confirmBox">
    <div class="ic">🗑️</div><h3>是否确认删除</h3><p>${esc(message)}</p>
    <div class="confirmActions"><button class="sec" id="cfCancel">取消</button><button class="danger" id="cfOk">${esc(confirmText)}</button></div>
  </div></div>`;
  document.getElementById('cfCancel').onclick=()=>host.innerHTML='';
  document.getElementById('cfOk').onclick=()=>{host.innerHTML='';onConfirm();};
  host.querySelector('.scrim').onclick=e=>{if(e.target.classList.contains('scrim'))host.innerHTML='';};
}
function maskPhone(p){if(!p)return '—';const d=String(p).replace(/\s/g,'');if(d.length<=2)return '••';return '•••• '+d.slice(-2);}

async function api(path,opts={}){
  opts.headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});
  opts.credentials='same-origin';
  const ctrl=new AbortController();const tid=setTimeout(()=>ctrl.abort(),8000);opts.signal=ctrl.signal;
  let res;
  try{res=await fetch(API+path,opts);}
  catch(e){clearTimeout(tid);throw{message:'连接已断开,请回到 SIMHUB App 后重试',code:'DISCONNECTED'};}
  clearTimeout(tid);
  let body=null;try{body=await res.json();}catch(e){}
  if(res.status===401){location.href='/login';throw{message:'未授权'};}
  if(!res.ok||(body&&body.success===false))throw(body||{message:'请求失败'});
  return body?body.data:null;
}

/* 登录 */
document.getElementById('loginBtn').onclick=login;
document.getElementById('codeInput').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
async function login(){
  const code=document.getElementById('codeInput').value.trim();const errEl=document.getElementById('loginErr');errEl.textContent='';
  try{const res=await fetch(API+'/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});
    const b=await res.json();if(!b.success)throw b;token=b.data.token;sessionStorage.setItem('simhub_token',token);enterApp();
  }catch(e){errEl.textContent=e.message||'连接码错误';}
}
function logout(){const f=document.createElement('form');f.method='POST';f.action='/logout';const i=document.createElement('input');i.name='csrf_token';i.value=CSRF;f.appendChild(i);document.body.appendChild(f);f.submit();}
document.getElementById('logoutBtn').onclick=logout;

/* 主题 */
function applyTheme(){const dark=localStorage.getItem('simhub_theme');if(dark==='dark')document.body.classList.add('dark');else if(dark==='light')document.body.classList.remove('dark');else document.body.classList.toggle('dark',matchMedia('(prefers-color-scheme:dark)').matches);}
document.getElementById('themeBtn').onclick=()=>{const d=!document.body.classList.contains('dark');localStorage.setItem('simhub_theme',d?'dark':'light');document.body.classList.toggle('dark',d);};
applyTheme();

/* 导航 */
document.getElementById('nav').addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;setView(a.dataset.v);document.getElementById('sidebar').classList.remove('open');});
function setView(v){view=v;document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.v===v));
  const titles={overview:'概览',cards:'卡片管理',io:'导入与导出',settings:'设置'};
  document.getElementById('pageTitle').textContent=titles[v];selectMode=false;selected.clear();settingsPage='home';render();}

async function enterApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await loadStatus();await loadCountries();await loadCards();}
async function loadStatus(){try{const s=await api('/api/status');document.getElementById('deviceMeta').textContent=(s.deviceName||'')+' · '+(s.connectedDevices||0)+' 台在线';}catch(e){}}
async function loadCards(){try{cards=await api('/api/cards')||[];preloadBgs();render();}catch(e){toast(e.message);}}
function preloadBgs(){cards.forEach(c=>{const u=bgByAsset[c.cardBackgroundAssetName];if(u){const i=new Image();i.src=u;}});}

/* 渲染分发 */
const M=()=>document.getElementById('main');
function render(){ if(view==='overview')renderOverview(); else if(view==='cards')renderCards(); else if(view==='io')renderIO(); else renderSettings(); }

function daysLeft(c){return Math.ceil((new Date(c.expiryDate)-new Date())/86400000);}
function isoNoMillis(d){return d.toISOString().replace(/\.\d{3}Z$/,'Z');}
function addDays(d,n){const x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
function dateOnlyISO(v){return v?v+'T00:00:00Z':'';}
function daySpan(a,b){const n=Math.round((b-a)/86400000);return Number.isFinite(n)&&n>0?n:30;}

function renderOverview(){
  const total=cards.length;const exp=cards.filter(c=>daysLeft(c)<0).length;const soon=cards.filter(c=>{const d=daysLeft(c);return d>=0&&d<=7;}).length;
  const byCountry={};cards.forEach(c=>{const k=c.countryName||c.flag||'未知';byCountry[k]=(byCountry[k]||0)+1;});
  const top=Object.entries(byCountry).sort((a,b)=>b[1]-a[1]).slice(0,6);const max=Math.max(1,...top.map(t=>t[1]));
  const recent=[...cards].sort((a,b)=>new Date(b.updatedAt||0)-new Date(a.updatedAt||0)).slice(0,5);
  M().innerHTML=`
    <div class="statgrid">
      <div class="stat"><div class="n">${total}</div><div class="l">卡片总数</div></div>
      <div class="stat warn"><div class="n">${soon}</div><div class="l">7 天内到期</div></div>
      <div class="stat danger"><div class="n">${exp}</div><div class="l">已过期</div></div>
      <div class="stat"><div class="n">●</div><div class="l">服务运行中</div></div>
    </div>
    <div class="panel"><h3>国家 / 地区分布</h3>${top.map(([k,v])=>`<div class="bar"><span style="width:90px">${esc(k)}</span><div class="track"><div class="fill" style="width:${v/max*100}%"></div></div><span>${v}</span></div>`).join('')||'<span class="sub">暂无数据</span>'}</div>
    <div class="panel"><h3>最近修改</h3>${recent.map(c=>`<div class="recent"><span>${c.flag||'🌐'} ${esc(c.carrier||'未命名')}</span><span class="sub">${c.updatedAt?new Date(c.updatedAt).toLocaleString():''}</span></div>`).join('')||'<span class="sub">暂无</span>'}</div>`;
}

function cardHTML(c){
  const d=daysLeft(c);let badge='';if(d<0)badge='<span class="badge exp">已过期</span>';else if(d<=7)badge='<span class="badge soon">'+d+'天</span>';
  const rev=revealed.has(c.id)||!maskDefault;
  const phoneTxt=c.phoneNumber?(rev?esc(c.phoneNumber):maskPhone(c.phoneNumber)):'—';
  const eye=c.phoneNumber?`<button class="iconbtn eyebtn" data-id="${c.id}" onclick="event.stopPropagation();toggleEye('${c.id}')">${rev?EYEOFF:EYE}</button>`:'';
  const icon=c.carrierAppIconURLString?`<img src="${esc(c.carrierAppIconURLString)}" class="appicon" style="width:30px;height:30px">`:`<span class="flag">${c.flag||'🌐'}</span>`;
  const bg=bgByAsset[c.cardBackgroundAssetName];
  const bgLayers=bg?`<div class="card-bg" style="background-image:url('${esc(bg)}')"></div><div class="card-shade"></div>`:'';
  return `<div class="card ${bg?'hasbg':''} ${selected.has(c.id)?'sel':''}" data-id="${c.id}">
    ${bgLayers}
    ${selectMode?`<div class="selcheck">${selected.has(c.id)?'✓':''}</div>`:`<button class="iconbtn moreBtn" data-id="${c.id}" onclick="event.stopPropagation();openDetailById('${c.id}')" aria-label="详情">⋯</button>`}
    ${icon}
    <h3>${esc(c.carrier||'未命名')} ${badge}</h3>
    <div class="sub">${esc(c.countryName||'')} ${esc(c.plan||'')}</div>
    <div class="row"><span class="phone">${phoneTxt}${eye}</span><span>${c.expiryDate?new Date(c.expiryDate).toLocaleDateString():''}</span></div>
  </div>`;
}
function toggleEye(id){if(revealed.has(id))revealed.delete(id);else revealed.add(id);render();}

function filteredCards(){
  const q=(document.getElementById('search')?.value||'').toLowerCase();
  const country=document.getElementById('fCountry')?.value||'';
  const status=document.getElementById('fStatus')?.value||'';
  const sort=document.getElementById('fSort')?.value||'order';
  let list=cards.filter(c=>{
    if(q&&![c.carrier,c.countryName,c.phoneNumber,c.plan].join(' ').toLowerCase().includes(q))return false;
    if(country&&(c.countryName||'')!==country)return false;
    const d=daysLeft(c);
    if(status==='exp'&&d>=0)return false;
    if(status==='soon'&&!(d>=0&&d<=7))return false;
    if(status==='active'&&d<0)return false;
    return true;
  });
  if(sort==='expiry')list.sort((a,b)=>new Date(a.expiryDate)-new Date(b.expiryDate));
  else if(sort==='carrier')list.sort((a,b)=>(a.carrier||'').localeCompare(b.carrier||''));
  else list.sort((a,b)=>(a.orderIndex||0)-(b.orderIndex||0));
  return list;
}

function renderCards(){
  const countries=[...new Set(cards.map(c=>c.countryName).filter(Boolean))].sort();
  const filters=`
      <select id="fCountry"><option value="">全部国家</option>${countries.map(c=>`<option>${esc(c)}</option>`).join('')}</select>
      <select id="fStatus"><option value="">全部状态</option><option value="active">使用中</option><option value="soon">即将到期</option><option value="exp">已过期</option></select>
      <select id="fSort"><option value="order">默认排序</option><option value="expiry">按到期</option><option value="carrier">按运营商</option></select>`;
  const toolbar=selectMode?`
    <div class="toolbar">
      <input id="search" placeholder="搜索运营商/国家/号码">
      ${filters}
      <span style="flex:1"></span>
      <span id="selCount" class="sub"></span>
      <button class="sec" id="tagBtn">批量打标签</button>
      <button class="danger" id="delBtn">批量删除</button>
      <button class="ghost" id="doneBtn">完成</button>
    </div>`:`
    <div class="toolbar">
      <input id="search" placeholder="搜索运营商/国家/号码">
      ${filters}
      <span style="flex:1"></span>
      <button class="sec" id="selBtn">批量编辑</button>
      <button id="newBtn">+ 新建卡片</button>
    </div>`;
  M().innerHTML=toolbar+`
    <div id="grid" class="grid"></div>
    <p id="empty" class="sub hidden" style="text-align:center;padding:40px">无符合条件的卡片</p>`;
  ['search','fCountry','fStatus','fSort'].forEach(id=>document.getElementById(id).addEventListener('input',drawGrid));
  if(selectMode){
    document.getElementById('tagBtn').onclick=batchTag;
    document.getElementById('delBtn').onclick=batchDelete;
    document.getElementById('doneBtn').onclick=()=>{selectMode=false;selected.clear();renderCards();};
  }else{
    document.getElementById('selBtn').onclick=()=>{selectMode=true;selected.clear();renderCards();};
    document.getElementById('newBtn').onclick=()=>openDrawer(null);
  }
  drawGrid();updateSel();
}
function drawGrid(){
  const list=filteredCards();const grid=document.getElementById('grid');grid.innerHTML=list.map(cardHTML).join('');
  document.getElementById('empty').classList.toggle('hidden',list.length>0);
  grid.querySelectorAll('.card').forEach(el=>el.onclick=()=>{const c=cards.find(x=>x.id===el.dataset.id);if(selectMode){toggleSel(c.id);}else openDetail(c);});
}

/* 批量 */

function toggleSel(id){if(selected.has(id))selected.delete(id);else selected.add(id);drawGrid();updateSel();}
function updateSel(){const el=document.getElementById('selCount');if(el)el.textContent='已选 '+selected.size;}
function batchDelete(){if(!selected.size)return toast('未选择');
  confirmDelete('确定删除选中的 '+selected.size+' 张卡片?此操作无法撤销。',async()=>{
    try{const r=await api('/api/cards/batch-update',{method:'POST',body:JSON.stringify({ids:[...selected],action:'delete'})});toast('已删除 '+r.deleted+' 张');selected.clear();await loadCards();renderCards();}catch(e){toast(e.message);}
  },'删除 '+selected.size+' 张');}
async function batchTag(){if(!selected.size)return toast('未选择');const t=prompt('输入要添加的标签(逗号分隔)');if(!t)return;
  try{const r=await api('/api/cards/batch-update',{method:'POST',body:JSON.stringify({ids:[...selected],action:'addTags',tags:t.split(',').map(s=>s.trim()).filter(Boolean)})});toast('已更新 '+r.updated+' 张');await loadCards();renderCards();}catch(e){toast(e.message);}}

/* 导入导出 */
function renderIO(){
  M().innerHTML=`
    <div class="panel"><h3>导出</h3><p class="sub" style="margin-top:0">导出全部卡片为 JSON 文件。</p><button id="expBtn">导出 JSON</button></div>
    <div class="panel"><h3>导入</h3><p class="sub" style="margin-top:0">导入前会先预览,去重后写入,不覆盖整个数据库。</p>
      <div class="drop" id="drop">拖拽 JSON 文件到此,或<label style="color:var(--accent);cursor:pointer"> 选择文件<input id="file" type="file" accept=".json,application/json" class="hidden"></label></div>
      <div id="impPreview"></div></div>`;
  document.getElementById('expBtn').onclick=doExport;
  const drop=document.getElementById('drop');const file=document.getElementById('file');
  file.onchange=()=>file.files[0]&&readImport(file.files[0]);
  ['dragover','dragenter'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('over');}));
  ['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('over');}));
  drop.addEventListener('drop',ev=>{const f=ev.dataTransfer.files[0];if(f)readImport(f);});
}
async function doExport(){
  try{const res=await fetch(API+'/api/export',{credentials:'same-origin'});const blob=await res.blob();
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='simhub-export.json';a.click();}catch(e){toast('导出失败');}
}
let importCards=null;
function readImport(f){
  const r=new FileReader();r.onload=async()=>{
    let arr;try{arr=JSON.parse(r.result);if(!Array.isArray(arr))throw 0;}catch(e){return toast('文件格式不正确');}
    try{const p=await api('/api/import',{method:'POST',body:JSON.stringify({mode:'preview',cards:arr})});importCards=arr;
      document.getElementById('impPreview').innerHTML=`<p style="margin-top:14px">预览:共 <b>${p.count}</b> 张卡片。<button id="commitBtn" style="margin-left:10px">确认导入</button></p>`;
      document.getElementById('commitBtn').onclick=commitImport;
    }catch(e){toast(e.message||'解析失败');}
  };r.readAsText(f);
}
async function commitImport(){
  try{const r=await api('/api/import',{method:'POST',body:JSON.stringify({mode:'commit',cards:importCards})});
    toast('导入 '+r.imported+' 张,跳过 '+r.skipped+' 张');importCards=null;document.getElementById('impPreview').innerHTML='';await loadCards();}catch(e){toast(e.message);}
}

function settingsHeader(title){return `<div class="subhead"><button class="iconbtn" id="backBtn" aria-label="返回"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg></button><h2>${title}</h2></div>`;}
function renderSettingsSecurity(){
  M().innerHTML=settingsHeader('账户安全')+`

function renderSettingsEmail(){
  M().innerHTML=settingsHeader('邮件 / 邮箱验证')+`
    <div class="panel"><p class="sub" id="smtpHint" style="margin-top:0">填好发信邮箱后，可开启登录两步验证与卡片到期提醒。</p><div class="field"><label>信箱服务商</label><select id="smProvider"><option value="qq">QQ邮箱</option><option value="gmail">Gmail</option><option value="163">网易163</option><option value="126">网易126</option><option value="custom">自订</option></select></div><div class="field"><label>SMTP 服务器 / 端口</label><div class="two"><input id="smHost" placeholder="smtp.example.com"><input id="smPort" style="max-width:96px" inputmode="numeric"></div></div><div class="field"><label>发信邮箱地址</label><input id="smUser" type="email" placeholder="you@example.com"></div><div class="field"><label>授权码 / 应用专用密码</label><input id="smPass" type="password" placeholder="授权码 / 应用专用密码"></div><p class="sub" style="margin:-4px 0 0">不是邮箱登录密码：QQ / 网易在邮箱设置里开启 SMTP 取得「授权码」；Gmail 使用「应用专用密码」。</p><div class="field" style="margin-top:13px"><label>收件邮箱（留空＝发给自己）</label><input id="smRcpt" type="email" placeholder="留空则发到发信邮箱"></div><div class="field"><label class="ltrow"><span>登录两步验证</span><input type="checkbox" id="smTwofa"></label></div><div class="field"><label class="ltrow"><span>卡片到期提醒邮件</span><input type="checkbox" id="smRemind"></label></div><div class="field"><label>提前几天提醒</label><input id="smDays" style="max-width:96px" inputmode="numeric" value="3"></div><div class="drawerActions"><button id="smSave" style="flex:1">保存</button><button class="sec" id="smTest">寄送测试邮件</button></div></div>`;
  dG('backBtn').onclick=()=>{settingsPage='home';render();};
  dG('smProvider').onchange=applyProvider;
  dG('smSave').onclick=saveSmtp;
  dG('smTest').onclick=testSmtp;
  loadAccount();
}
const SMTP_PRESETS={qq:['smtp.qq.com',465],gmail:['smtp.gmail.com',465],'163':['smtp.163.com',465],'126':['smtp.126.com',465]};
function applyProvider(){const p=dG('smProvider').value;if(SMTP_PRESETS[p]){dG('smHost').value=SMTP_PRESETS[p][0];dG('smPort').value=SMTP_PRESETS[p][1];}}
function smtpBody(){const b={host:dG('smHost').value.trim(),port:parseInt(dG('smPort').value)||465,username:dG('smUser').value.trim(),recipient:dG('smRcpt').value.trim(),twofaEnabled:dG('smTwofa').checked,reminderEnabled:dG('smRemind').checked,reminderDaysBefore:parseInt(dG('smDays').value)||3};const pw=dG('smPass').value;if(pw)b.password=pw;return b;}
async function loadAccount(){
  try{const a=await api('/api/smtp');
    dG('smHost').value=a.host||'';dG('smPort').value=a.port||465;
    dG('smUser').value=a.username||'';dG('smRcpt').value=a.recipient||'';
    dG('smPass').value='';dG('smPass').placeholder=a.hasPassword?'已保存，留空表示不修改':'授权码 / 应用专用密码';
    dG('smTwofa').checked=a.twofaEnabled;dG('smRemind').checked=a.reminderEnabled;dG('smDays').value=a.reminderDaysBefore||3;
    let prov='custom';for(const k in SMTP_PRESETS){if(SMTP_PRESETS[k][0]===a.host)prov=k;}dG('smProvider').value=prov;
  }catch(e){}
}
async function saveSmtp(){
  try{await api('/api/smtp',{method:'POST',body:JSON.stringify(smtpBody())});toast('已保存');loadAccount();}
  catch(e){toast(e.message||'保存失败');}
}
async function testSmtp(){
  try{await api('/api/smtp',{method:'POST',body:JSON.stringify(smtpBody())});const r=await api('/api/smtp/test',{method:'POST'});toast('测试邮件已发送到 '+r.to);loadAccount();}
  catch(e){toast(e.message||'发送失败');}
}
async function changePassword(){
  const cur=dG('pwCur').value, n1=dG('pwNew').value, n2=dG('pwNew2').value;
  if(n1.length<8)return toast('新密码至少 8 位');
  if(n1!==n2)return toast('两次输入的新密码不一致');
  try{await api('/api/password',{method:'POST',body:JSON.stringify({current:cur,new:n1})});toast('密码已更新');dG('pwCur').value=dG('pwNew').value=dG('pwNew2').value='';}
  catch(e){toast(e.message||'修改失败');}
}

    ${f('f_eid','EID(选填)',d.eid,'32 位 EID')}
    <div class="secLabel">到期时间</div>
    <div class="field"><label>方案开始日期</label><input id="f_start" type="date" value="${(d.activationDate||'').slice(0,10)}"></div>
    <div class="field"><label>方案时长(快捷)</label><div class="durs" id="durs">${DURS.map(([n,t])=>`<button type="button" class="dur" data-n="${n}">${t}</button>`).join('')}</div></div>
    <div class="field"><label class="ltrow"><span>长期保号</span><input type="checkbox" id="f_longterm" ${d.isLongTerm?'checked':''}></label></div>
    <div class="field"><label>精确到期日期</label><input id="f_expiry" type="date" value="${(d.expiryDate||'').slice(0,10)}"></div>
    <div id="daySummary" class="summary"></div>
    <div class="drawerActions"><button id="saveBtn" style="flex:1">保存</button>${isNew?'':'<button class="danger" id="delBtn2">删除</button>'}<button class="sec" id="cancelBtn">取消</button></div>
    </div></div>`;
  refreshAppRow();refreshCountryRow();refreshBgRow();updateSummary();
  dG('appRow').onclick=()=>openAppPicker();
  dG('countryRow').onclick=()=>openCountryPicker();
  dG('bgRow').onclick=()=>openBgPicker();
  dG('durs').querySelectorAll('.dur').forEach(b=>b.onclick=()=>{const s=dG('f_start').value||new Date().toISOString().slice(0,10);dG('f_expiry').value=isoNoMillis(addDays(new Date(s),+b.dataset.n)).slice(0,10);updateSummary();});
  dG('f_start').onchange=updateSummary;dG('f_expiry').onchange=updateSummary;
  dG('cancelBtn').onclick=()=>document.getElementById('drawerHost').innerHTML='';
  dG('saveBtn').onclick=()=>save(card,isNew);
  if(!isNew)dG('delBtn2').onclick=()=>delCard(card);
}
function refreshAppRow(){const d=drawerData;dG('appRow').innerHTML=d.carrierAppIconURLString?`<img src="${esc(d.carrierAppIconURLString)}" class="appicon"><span>${esc(d.carrierAppName||'已选图标')}</span><span class="chev">›</span>`:`<span class="ph">从 App Store 选择图标</span><span class="chev">›</span>`;}
function refreshCountryRow(){const d=drawerData;dG('countryRow').innerHTML=`<span style="font-size:20px">${d.flag||'🌐'}</span><span>${esc(d.countryName||'选择国家 / 地区')}</span><span class="chev">›</span>`;}
function refreshBgRow(){const d=drawerData;const bg=bgByAsset[d.cardBackgroundAssetName];dG('bgRow').innerHTML=bg?`<img src="${esc(bg)}" class="appicon" style="object-fit:cover"><span>${esc(d.countryName||'已选背景')}</span><span class="chev">›</span>`:`<span class="ph">默认（无背景图）</span><span class="chev">›</span>`;}
function updateSummary(){const s=dG('f_start').value,e=dG('f_expiry').value;dG('daySummary').textContent=(s&&e)?`开始 ${s} → 到期 ${e}（${daySpan(new Date(s),new Date(e))} 天）`:'';}

async function save(orig,isNew){
  const btn=dG('saveBtn');btn.disabled=true;btn.textContent='保存中…';
  const v=id=>(dG(id)?dG(id).value:'');
  const start=dateOnlyISO(v('f_start'))||drawerData.activationDate;
  const expiry=dateOnlyISO(v('f_expiry'))||drawerData.expiryDate;
  const p=Object.assign({},drawerData,{
    carrier:v('f_carrier'),plan:v('f_plan'),price:v('f_price'),currencyCode:v('f_currencyCode')||'USD',
    phoneNumber:v('f_phoneNumber'),websiteURL:v('f_websiteURL'),currentBalance:v('f_currentBalance'),
    transactionNotes:v('f_transactionNotes'),customPrompt:v('f_customPrompt'),
    smdpAddress:v('f_smdpAddress'),activationCode:v('f_activationCode'),
    confirmationCode:v('f_confirmationCode'),eid:v('f_eid'),
    tags:v('f_tags').split(',').map(s=>s.trim()).filter(Boolean),
    activationDate:start,expiryDate:expiry,
    isLongTerm:dG('f_longterm').checked,
    renewDays:daySpan(new Date(start),new Date(expiry)),
    createdAt:drawerData.createdAt||isoNoMillis(new Date())
  });
  p.renewalIntervalValue=p.renewDays;p.renewalUnit='days';
  try{
    if(isNew){delete p.id;await api('/api/cards',{method:'POST',body:JSON.stringify(p)});}
    else await api('/api/cards/'+orig.id,{method:'PUT',body:JSON.stringify(p)});
    document.getElementById('drawerHost').innerHTML='';toast('已保存');await loadCards();
  }catch(e){btn.disabled=false;btn.textContent='保存';
    if(e.code==='CONFLICT'){if(confirm('App 内这张卡已被修改。重新加载最新数据?')){document.getElementById('drawerHost').innerHTML='';await loadCards();}}
    else toast(e.message||'保存失败');}
}
function openDetailById(id){const c=cards.find(x=>x.id===id);if(c)openDetail(c);}
function detailRow(label,val){return (val||val===0)?`<div class="dRow"><span class="dL">${esc(label)}</span><span class="dV">${esc(val)}</span></div>`:'';}
function openDetail(card){
  const c=card;const dl=daysLeft(c);
  const start=c.activationDate?new Date(c.activationDate).toLocaleDateString():'';
  const expiry=c.expiryDate?new Date(c.expiryDate).toLocaleDateString():'';
  const leftTxt=Number.isFinite(dl)?(dl>=0?`剩余 ${dl} 天`:`已过期 ${-dl} 天`):'';
  const price=c.price?`${c.price}${c.currencyCode?(' '+c.currencyCode):''}`:'';
  const tags=(c.tags||[]).join('、');
  const close=()=>document.getElementById('drawerHost').innerHTML='';
  document.getElementById('drawerHost').innerHTML=`<div class="scrim"><div class="drawer">
    <div class="detailHead"><span style="font-size:34px">${c.flag||'🌐'}</span>
      <div><h2 style="margin:0">${esc(c.carrier||'未命名')}</h2><div class="sub">${esc(c.countryName||'')} ${esc(c.plan||'')}</div></div></div>
    ${detailRow('电话号码',c.phoneNumber)}
    ${detailRow('套餐',c.plan)}
    ${detailRow('价格',price)}
    ${detailRow('目前余额',c.currentBalance)}
    ${detailRow('开始日期',start)}
    ${detailRow('到期日期',expiry+(leftTxt?`（${leftTxt}）`:''))}
    ${detailRow('续期周期',c.renewDays?`${c.renewDays} 天`:'')}
    ${detailRow('SM-DP+ 地址',c.smdpAddress)}
    ${detailRow('激活码',c.activationCode)}
    ${detailRow('确认码',c.confirmationCode)}
    ${detailRow('EID',c.eid)}
    ${detailRow('标签',tags)}
    ${detailRow('官网',c.websiteURL)}
    ${detailRow('流水记录',c.transactionNotes)}
    ${detailRow('自订提示词',c.customPrompt)}
    <div class="drawerActions" style="margin-top:18px"><button id="dtEdit" style="flex:1">编辑</button><button class="danger" id="dtDel">删除</button><button class="sec" id="dtClose">关闭</button></div>
  </div></div>`;
  dG('dtClose').onclick=close;
  document.querySelector('#drawerHost .scrim').onclick=e=>{if(e.target.classList.contains('scrim'))close();};
  dG('dtEdit').onclick=()=>openDrawer(c);
  dG('dtDel').onclick=()=>delCard(c);
}
function delCard(card){
  confirmDelete('确定删除这张卡片「'+(card.carrier||'未命名')+'」?此操作无法撤销。',async()=>{
    try{await api('/api/cards/'+card.id,{method:'DELETE'});document.getElementById('drawerHost').innerHTML='';toast('已删除');await loadCards();}catch(e){toast(e.message);}
  });}

/* 国家 / 地区选择器(数据来自 App 的 CountryRegion) */
let countriesCache=null; let bgByAsset={};
async function loadCountries(){
  if(countriesCache)return countriesCache;
  try{countriesCache=await api('/api/countries')||[];}catch(e){countriesCache=[];}
  bgByAsset={};countriesCache.forEach(c=>{if(c.bgAsset&&c.bgUrl)bgByAsset[c.bgAsset]=c.bgUrl;});
  return countriesCache;
}
async function openCountryPicker(){
  await loadCountries();
  const host=document.getElementById('pickerHost');
  host.innerHTML=`<div class="scrim picker"><div class="pickerBox"><div class="pickerHead"><b>选择国家 / 地区</b><button class="iconbtn" id="pkClose">✕</button></div>
    <input id="pkSearch" placeholder="搜索国家、代码或区号" autofocus>
    <div class="pickerList" id="pkList"></div></div></div>`;
  const draw=()=>{const q=dG('pkSearch').value.toLowerCase();
    dG('pkList').innerHTML=countriesCache.filter(c=>!q||[c.name,c.english,c.code,c.calling].join(' ').toLowerCase().includes(q)).slice(0,400)
      .map(c=>`<div class="pkItem" data-code="${c.code}"><span style="font-size:22px">${c.flag||'🌐'}</span><div><div>${esc(c.name)}</div><div class="sub">${c.code} · +${c.calling||''} · ${esc(c.english||'')}</div></div></div>`).join('');
    dG('pkList').querySelectorAll('.pkItem').forEach(el=>el.onclick=()=>{const c=countriesCache.find(x=>x.code===el.dataset.code);drawerData.countryCode=c.code;drawerData.countryName=c.name;drawerData.flag=c.flag||'🌐';drawerData.cardBackgroundAssetName=c.bgAsset||'';refreshCountryRow();refreshBgRow();host.innerHTML='';});};
  dG('pkSearch').addEventListener('input',draw);dG('pkClose').onclick=()=>host.innerHTML='';
  host.querySelector('.scrim').onclick=e=>{if(e.target.classList.contains('scrim'))host.innerHTML='';};draw();
}
async function openBgPicker(){
  await loadCountries();
  const host=document.getElementById('pickerHost');
  const withBg=countriesCache.filter(c=>c.bgUrl);
  host.innerHTML=`<div class="scrim picker"><div class="pickerBox"><div class="pickerHead"><b>选择卡片背景</b><button class="iconbtn" id="bgClose">✕</button></div>
    <input id="bgSearch" placeholder="搜索国家">
    <div class="pickerList" id="bgList"></div></div></div>`;
  const draw=()=>{const q=dG('bgSearch').value.toLowerCase();
    const head=`<div class="pkItem" data-asset=""><span style="font-size:22px">🚫</span><div><div>默认（无背景图）</div></div></div>`;
    const rows=withBg.filter(c=>!q||[c.name,c.english,c.code].join(' ').toLowerCase().includes(q)).slice(0,400)
      .map(c=>`<div class="pkItem" data-asset="${c.bgAsset}"><img src="${esc(c.bgUrl)}" class="appicon" style="object-fit:cover"><div><div>${esc(c.name)}</div><div class="sub">${esc(c.english||c.code)}</div></div></div>`);
    dG('bgList').innerHTML=[head].concat(rows).join('');
    dG('bgList').querySelectorAll('.pkItem').forEach(el=>el.onclick=()=>{drawerData.cardBackgroundAssetName=el.dataset.asset;refreshBgRow();host.innerHTML='';});};
  dG('bgSearch').addEventListener('input',draw);dG('bgClose').onclick=()=>host.innerHTML='';
  host.querySelector('.scrim').onclick=e=>{if(e.target.classList.contains('scrim'))host.innerHTML='';};draw();
}

/* 运营商 App 图标选择(代后端 iTunes,按所选国家 storefront) */
async function openAppPicker(){
  const host=document.getElementById('pickerHost');
  host.innerHTML=`<div class="scrim picker"><div class="pickerBox"><div class="pickerHead"><b>选择运营商 App 图标</b><button class="iconbtn" id="apClose">✕</button></div>
    <input id="apSearch" placeholder="搜索运营商 App" value="${esc(drawerData.carrier||'')}" autofocus>
    <div class="pickerList" id="apList"><p class="sub" style="padding:20px;text-align:center">输入后回车搜索 · 结果来自 Apple iTunes Search API</p></div></div></div>`;
  const run=async()=>{const term=dG('apSearch').value.trim();if(!term)return;dG('apList').innerHTML='<p class="sub" style="padding:20px;text-align:center">搜索中…</p>';
    try{const r=await api('/api/appsearch?term='+encodeURIComponent(term)+'&country='+encodeURIComponent(drawerData.countryCode||'US'))||[];
      dG('apList').innerHTML=r.length?r.map((a,i)=>`<div class="pkItem" data-i="${i}"><img src="${esc(a.icon)}" class="appicon"><div><div>${esc(a.name)}</div><div class="sub">${esc(a.seller||'')}</div></div></div>`).join(''):'<p class="sub" style="padding:20px;text-align:center">没有找到匹配的 App,换个词或继续用国旗</p>';
      dG('apList').querySelectorAll('.pkItem').forEach(el=>el.onclick=()=>{const a=r[+el.dataset.i];drawerData.carrierAppName=a.name;drawerData.carrierAppIconURLString=a.icon;drawerData.carrierAppStoreURLString=a.url||'';refreshAppRow();host.innerHTML='';});
    }catch(e){dG('apList').innerHTML='<p class="sub" style="padding:20px;text-align:center">'+esc(e.message||'搜索失败')+'</p>';}};
  dG('apSearch').addEventListener('keydown',e=>{if(e.key==='Enter')run();});
  dG('apClose').onclick=()=>host.innerHTML='';host.querySelector('.scrim').onclick=e=>{if(e.target.classList.contains('scrim'))host.innerHTML='';};run();
}

/* 轮询 */
let lastVersion=0;
setInterval(async()=>{
  if(document.getElementById('app').classList.contains('hidden'))return;
  if(document.getElementById('drawerHost').innerHTML)return; // 编辑中不打断,避免手机端卡顿
  try{const s=await api('/api/status');document.getElementById('deviceMeta').textContent=(s.deviceName||'')+' · '+(s.connectedDevices||0)+' 台在线';
    if(s.dataVersion&&s.dataVersion!==lastVersion){if(lastVersion!==0)await loadCards();lastVersion=s.dataVersion;}}catch(e){}
},4000);

enterApp();
</script>
