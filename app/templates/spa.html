<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIMHUB Web 管理</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2f6df6">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SIMHUB">
<style nonce="__CSP_NONCE__">
:root{
  color-scheme:light;
  --bg:#eef5fb; --card:rgba(255,255,255,.72); --card2:rgba(255,255,255,.5); --text:#111827; --sub:#526174; --muted:#7a8798; --line:rgba(127,146,172,.24);
  --glass:rgba(255,255,255,.68); --glass-strong:rgba(255,255,255,.82); --glass-soft:rgba(255,255,255,.48);
  --accent:#2f6df6; --accent2:#14b8a6; --accent3:#f97378; --accent-weak:rgba(47,109,246,.14); --danger:#dc2626; --ok:#16a34a; --warn:#d97706; --neutral:#64748b;
  --radius:18px; --radius-sm:12px; --radius-xs:10px;
  --shadow:0 14px 34px rgba(31,45,70,.1),inset 0 1px 0 rgba(255,255,255,.68);
  --shadow-lg:0 18px 48px rgba(31,45,70,.14),inset 0 1px 0 rgba(255,255,255,.72);
  --ring:0 0 0 4px var(--accent-weak); --t:.18s cubic-bezier(.4,0,.2,1);
  --sidebar:rgba(255,255,255,.76);
}
.dark{
  color-scheme:dark;
  --bg:#090d14; --card:rgba(19,25,36,.66); --card2:rgba(15,20,30,.5); --text:#f7f8fb; --sub:#b8c0ce; --muted:#8f9aaa; --line:rgba(255,255,255,.12);
  --glass:rgba(19,25,36,.62); --glass-strong:rgba(25,32,46,.78); --glass-soft:rgba(255,255,255,.08);
  --accent:#7aa2ff; --accent2:#2dd4bf; --accent3:#fb7185; --accent-weak:rgba(122,162,255,.22);
  --shadow:0 16px 44px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.08);
  --shadow-lg:0 22px 64px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12); --sidebar:rgba(16,22,32,.72);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:
  linear-gradient(135deg,rgba(255,255,255,.96),rgba(232,240,248,.9) 31%,rgba(240,248,246,.92) 64%,rgba(238,241,250,.96)),
  linear-gradient(112deg,rgba(47,109,246,.16),rgba(47,109,246,0) 43%),
  linear-gradient(306deg,rgba(20,184,166,.14),rgba(20,184,166,0) 48%),
  var(--bg);background-attachment:fixed;color:var(--text);letter-spacing:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
.dark{background:
  linear-gradient(135deg,rgba(11,15,23,.98),rgba(18,24,36,.96) 35%,rgba(10,28,31,.94) 68%,rgba(16,18,28,.98)),
  linear-gradient(112deg,rgba(122,162,255,.16),rgba(122,162,255,0) 43%),
  linear-gradient(306deg,rgba(45,212,191,.12),rgba(45,212,191,0) 48%),
  var(--bg)}
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.14) 0 1px,transparent 1px 78px),
  repeating-linear-gradient(0deg,rgba(255,255,255,.12) 0 1px,transparent 1px 72px);
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.68),rgba(0,0,0,.18));opacity:.42}
.dark:before{opacity:.18}
.hidden{display:none!important}
button{font:inherit;cursor:pointer;border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:9px 15px;background:linear-gradient(135deg,var(--accent),#45a7ff);color:#fff;font-weight:700;letter-spacing:0;box-shadow:0 10px 24px rgba(47,109,246,.22),inset 0 1px 0 rgba(255,255,255,.28);transition:filter var(--t),transform var(--t),box-shadow var(--t),background var(--t)}
button:hover{filter:brightness(1.06)}
button:active{transform:scale(.97)}
button:focus-visible{outline:none;box-shadow:var(--ring)}
button.sec{background:var(--glass-soft);color:var(--text);border:1px solid var(--line);filter:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.48)}
button.sec:hover{background:var(--glass-strong);filter:none}
button.danger{background:linear-gradient(135deg,var(--danger),#fb7185)}
button.ghost{background:transparent;color:var(--text)}
button.ghost:hover{background:var(--glass-soft);filter:none}
button:disabled{opacity:.5;cursor:default;transform:none;filter:none}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.48);color:var(--text);outline:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.5);backdrop-filter:blur(14px) saturate(140%);transition:border-color var(--t),box-shadow var(--t),background var(--t)}
.dark input,.dark select,.dark textarea{background:rgba(12,17,26,.52);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:var(--ring)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:10px;background:transparent;color:var(--sub);padding:0;box-shadow:none;transition:background var(--t),color var(--t)}
.iconbtn:hover{background:var(--glass-soft);color:var(--text)}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#2f6df6,#14b8a6 56%,#f97378);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:#fff;font-size:18px;font-weight:800;overflow:hidden;box-shadow:0 12px 26px rgba(47,109,246,.26),inset 0 1px 0 rgba(255,255,255,.5)}

/* 框架 */
#app{display:flex;min-height:100vh}
#app,#drawerHost,#pickerHost,#confirmHost,#toastHost{position:relative;z-index:1}
#sidebar{width:230px;background:var(--sidebar);border-right:1px solid var(--line);padding:18px 12px;flex-shrink:0;position:sticky;top:0;height:100vh;backdrop-filter:blur(24px) saturate(150%);box-shadow:inset -1px 0 0 rgba(255,255,255,.22)}
.brandRow{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
.brandRow .logo{width:32px;height:32px;border-radius:9px;font-size:17px;margin:0}
.brandRow b{font-size:16px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:var(--text);cursor:pointer;font-size:15px;font-weight:650;transition:background var(--t),color var(--t),box-shadow var(--t),transform var(--t)}
.nav a.active{background:linear-gradient(135deg,rgba(47,109,246,.96),rgba(20,184,166,.88));color:#fff;box-shadow:0 14px 28px rgba(47,109,246,.22),inset 0 1px 0 rgba(255,255,255,.34)}
.nav a:not(.active):hover{background:var(--glass-soft);transform:translateX(2px)}
.navIcon{width:30px;height:30px;flex:0 0 30px;object-fit:contain;border-radius:9px;display:block;filter:drop-shadow(0 4px 10px rgba(47,109,246,.18))}
.navGlyph{width:30px;height:30px;flex:0 0 30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--accent-weak);color:var(--accent)}
.navGlyph svg{width:17px;height:17px}
#content{flex:1;min-width:0;display:flex;flex-direction:column}
header{position:sticky;top:14px;z-index:5;background:var(--glass-strong);backdrop-filter:saturate(180%) blur(24px);border:1px solid var(--line);border-radius:20px;display:flex;align-items:center;gap:12px;padding:12px 16px;margin:14px 22px 0;box-shadow:var(--shadow)}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:0}
header .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 5px rgba(22,163,74,.12)}
header .spacer{flex:1}
header .meta{font-size:12px;color:var(--sub)}
main{padding:22px;max-width:1200px;width:100%}

.statgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.stat{background:var(--glass);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;border:1px solid var(--line);backdrop-filter:blur(22px) saturate(155%);transition:transform var(--t),box-shadow var(--t),background var(--t)}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.stat .n{font-size:30px;font-weight:800;letter-spacing:0}
.stat .l{color:var(--sub);font-size:13px;margin-top:2px}
.stat.warn .n{color:var(--warn)} .stat.danger .n{color:var(--danger)}
.panel{background:var(--glass);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);padding:18px;margin-top:18px;backdrop-filter:blur(22px) saturate(155%)}
.panel h3{margin:0 0 14px;font-size:15px;font-weight:750;letter-spacing:0}
.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px}
.sectionHead h3{margin:0}
button.mini{padding:6px 11px;border-radius:10px;font-size:13px;box-shadow:none}
.bar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.bar .track{flex:1;height:8px;background:rgba(255,255,255,.34);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px}
.recent{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.recent:last-child{border:none}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.toolbar input,.toolbar select{max-width:200px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.card{background:var(--glass);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;border:1px solid var(--line);position:relative;overflow:hidden;cursor:pointer;min-height:148px;backdrop-filter:blur(22px) saturate(155%);transition:transform var(--t),box-shadow var(--t),border-color var(--t),background var(--t)}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.card.sel{border-color:rgba(47,109,246,.72);box-shadow:0 0 0 2px var(--accent) inset,var(--shadow)}
.card.sel:hover{box-shadow:0 0 0 2px var(--accent) inset,var(--shadow-lg)}
.card .flag{font-size:26px}
.card h3{margin:6px 0 2px;font-size:16px;font-weight:750;letter-spacing:0}
.card .sub{color:var(--sub);font-size:13px}
.card .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--sub)}
.phone{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
.badge.exp{background:rgba(255,59,48,.15);color:var(--danger)}
.badge.soon{background:rgba(255,149,0,.15);color:var(--warn)}
.categoryChip{display:inline-flex;align-items:center;width:max-content;max-width:100%;height:24px;padding:0 9px;border-radius:999px;background:rgba(47,109,246,.1);border:1px solid rgba(47,109,246,.16);color:var(--accent);font-size:12px;font-weight:760;white-space:nowrap}
.selcheck{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.3);backdrop-filter:blur(10px)}
.card.sel .selcheck{background:var(--accent);border-color:var(--accent);color:#fff}

.scrim{position:fixed;inset:0;background:rgba(12,18,28,.36);backdrop-filter:blur(10px);display:flex;justify-content:flex-end;z-index:20}
.drawer{width:min(470px,100%);height:100%;background:var(--glass-strong);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);backdrop-filter:blur(26px) saturate(160%);overflow:auto;padding:20px;animation:slide .25s ease}
@keyframes slide{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px}
.drawerActions{display:flex;gap:10px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--glass-strong);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(18px) saturate(150%);padding:11px 18px;border-radius:24px;font-size:14px;z-index:30;animation:toastUp .25s cubic-bezier(.4,0,.2,1)}
@keyframes toastUp{from{transform:translate(-50%,12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:34px;text-align:center;color:var(--sub);background:var(--glass-soft)}
.drop.over{border-color:var(--accent);color:var(--accent)}
#menuBtn{display:none}
@media(max-width:760px){
  #sidebar{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:.25s;box-shadow:var(--shadow-lg)}
  #sidebar.open{transform:none}
  #menuBtn{display:inline-flex}
  header{top:8px;margin:8px 12px 0;padding:10px 12px;border-radius:16px}
  header .meta{display:none}
  main{padding:14px 12px 20px}
  .scrim{justify-content:stretch}
  .drawer{width:100%;-webkit-overflow-scrolling:touch}
}
.secLabel{font-size:13px;font-weight:700;color:var(--sub);margin:18px 0 8px;text-transform:none}
.two{display:flex;gap:10px}
.pickRow{width:100%;display:flex;align-items:center;gap:10px;background:var(--glass-soft);border:1px solid var(--line);
  color:var(--text);border-radius:11px;padding:11px 13px;font-weight:500;cursor:pointer;text-align:left;transition:border-color var(--t),background var(--t)}
.pickRow:hover{border-color:var(--accent);background:var(--glass)}
.pickRow .ph{color:var(--sub)}
.pickRow .chev{margin-left:auto;color:var(--sub);font-size:20px}
.appicon{width:34px;height:34px;border-radius:10px;object-fit:cover;background:var(--glass-soft);border:1px solid var(--line)}
.durs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dur{background:var(--glass-soft);border:1px solid var(--line);color:var(--text);font-weight:650;padding:9px;transition:background var(--t),color var(--t),border-color var(--t)}
.dur:hover{border-color:var(--accent);color:var(--accent)}
.dur:active{background:var(--accent);color:#fff;border-color:var(--accent)}
.ltrow{display:flex;align-items:center;justify-content:space-between}
.ltrow input{width:auto}
.summary{font-size:13px;color:var(--sub);text-align:center;margin:6px 0 4px}
.picker{justify-content:center;align-items:center;z-index:50}
.pickerBox{background:var(--glass-strong);width:min(440px,94vw);max-height:80vh;border:1px solid var(--line);box-shadow:var(--shadow-lg);backdrop-filter:blur(24px) saturate(155%);border-radius:18px;display:flex;flex-direction:column;overflow:hidden;padding:16px}
.pickerHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.pickerHead b{font-size:17px}
.pickerList{overflow:auto;margin-top:10px;-webkit-overflow-scrolling:touch}
.pkItem{display:flex;align-items:center;gap:12px;padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px;transition:background var(--t)}
.pkItem:hover{background:var(--glass-soft)}
.pkItem .sub{font-size:12px;color:var(--sub)}
.confirm{justify-content:center;align-items:center;z-index:60}
.confirmBox{background:var(--glass-strong);width:min(340px,90vw);border:1px solid var(--line);border-radius:20px;padding:24px 22px;text-align:center;box-shadow:var(--shadow-lg);backdrop-filter:blur(24px) saturate(155%)}
.confirmBox .ic{width:54px;height:54px;border-radius:50%;background:rgba(255,59,48,.14);color:var(--danger);
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:24px}
.confirmBox h3{margin:0 0 6px;font-size:18px}
.confirmBox p{margin:0 0 18px;color:var(--sub);font-size:14px;line-height:1.5}
.confirmActions{display:flex;gap:10px}
.confirmActions button{flex:1;padding:12px}
.logo{overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.setlist{background:var(--glass);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(22px) saturate(155%);overflow:hidden;margin-top:14px}
.setRow{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background var(--t)}
.setRow:last-child{border-bottom:none}
.setRow:hover{background:var(--glass-soft)}
.setRow .rt{flex:1;min-width:0}
.setRow .rt b{font-size:15px;font-weight:650;letter-spacing:0}
.setRow .rt span{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.setRow .chev{color:var(--sub);font-size:20px;line-height:1}
.setRow.danger .rt b{color:var(--danger)}
.setRow input[type=checkbox]{width:auto}
.apiBlock{border-top:1px solid var(--line);padding:16px 0}
.apiBlock:first-child{border-top:none;padding-top:0}
.apiBlock h3{margin:0 0 10px}
.apiRow{display:grid;grid-template-columns:92px minmax(180px,.75fr) minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.apiRow:last-child{border-bottom:none}
.apiRow code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text);background:rgba(255,255,255,.38);border:1px solid var(--line);border-radius:8px;padding:5px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.apiMethod{font-weight:850;color:var(--accent);font-size:12px}
.subhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.subhead h2{font-size:20px;margin:0;font-weight:750;letter-spacing:0}
.subhead .iconbtn{width:34px;height:34px}
.securityGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;max-width:1120px;margin-top:20px}
.securityCard{display:flex;flex-direction:column;background:rgba(255,255,255,.56);border:1px solid rgba(255,255,255,.62);border-radius:24px;box-shadow:0 16px 44px rgba(31,45,70,.1),inset 0 1px 0 rgba(255,255,255,.72);backdrop-filter:blur(24px) saturate(150%);padding:32px;min-width:0}
.securityCard h3{margin:0;font-size:20px;font-weight:780;letter-spacing:0;color:var(--text)}
.securityCard .sub{margin:8px 0 28px;font-size:14px;line-height:1.55;color:var(--sub)}
.securityFields{display:grid;gap:20px}
.securityFields .field{margin:0}
.securityFields .field label{font-size:13px;font-weight:700;color:#6b7588;margin-bottom:8px}
.securityFields input{height:56px;border-radius:14px;padding:0 16px;background:rgba(255,255,255,.68);border-color:rgba(255,255,255,.74);box-shadow:inset 0 1px 0 rgba(255,255,255,.62)}
.securityFields input[readonly]{color:#667085;background:rgba(255,255,255,.42)}
.securityActions{display:flex;justify-content:flex-end;margin-top:32px}
.securityActions button{min-width:136px;height:46px;border-radius:14px;box-shadow:0 10px 24px rgba(47,109,246,.18),inset 0 1px 0 rgba(255,255,255,.28)}
.dark .securityCard{background:rgba(25,32,46,.64);border-color:rgba(255,255,255,.13);box-shadow:0 18px 54px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.08)}
.dark .securityFields input{background:rgba(12,17,26,.5);border-color:rgba(255,255,255,.12)}
.dark .securityFields input[readonly]{background:rgba(255,255,255,.06);color:#a6afbf}
@media(max-width:920px){.securityGrid{grid-template-columns:1fr;max-width:none}.securityCard{padding:24px}.securityActions button{width:100%}}
@media(max-width:760px){.apiRow{grid-template-columns:1fr}.apiRow code{white-space:normal;word-break:break-all}.splitGrid{grid-template-columns:1fr}}
.card.hasbg h3{color:var(--text)}
.card.hasbg .sub,.card.hasbg .row{color:var(--sub)}
.card-bg{position:absolute;inset:0;background-size:cover;background-position:center right;z-index:0;border-radius:inherit;pointer-events:none}
.card-shade{position:absolute;inset:0;z-index:1;border-radius:inherit;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.92) 0%,rgba(255,255,255,.72) 40%,rgba(255,255,255,.28) 68%,rgba(255,255,255,.08) 100%);backdrop-filter:blur(1px)}
.dark .card-shade{background:linear-gradient(90deg,rgba(15,20,30,.9) 0%,rgba(15,20,30,.68) 40%,rgba(15,20,30,.28) 68%,rgba(15,20,30,.06) 100%)}
.card-content{position:relative;z-index:2}
.card.hasbg .selcheck{z-index:3}
.card-bg{background-color:var(--glass-soft)}
.moreBtn{position:absolute;top:8px;right:8px;font-size:20px;line-height:1;z-index:3}
.card:not(.hasbg) .moreBtn{color:var(--sub)}
.card.hasbg .moreBtn{color:#fff;background:rgba(15,20,30,.32);backdrop-filter:blur(10px)}
.card.hasbg .moreBtn:hover{background:rgba(15,20,30,.48)}
.detailHead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.detailHead h2{font-size:20px;letter-spacing:0}
.dRow{display:flex;justify-content:space-between;gap:16px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14px}
.dRow .dL{color:var(--sub);flex-shrink:0}
.dRow .dV{text-align:right;word-break:break-all}

.wheelCol{position:relative;z-index:3;height:210px;overflow-y:auto;scroll-snap-type:y mandatory;padding:81px 0;scrollbar-width:none;mask-image:linear-gradient(to bottom,transparent,black 18%,black 82%,transparent)}

<script nonce="__CSP_NONCE__">
const API=location.origin;
const CSRF="__CSRF_TOKEN__";
const MAX_IMPORT_BYTES=8*1024*1024;
if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js").catch(()=>{});}
const LOGO="/static/app-icon.jpg";
document.querySelectorAll(".logo").forEach(e=>{e.textContent="";const i=document.createElement("img");i.src=LOGO;e.appendChild(i);});
let cards=[]; let view='overview'; let revealed=new Set(); let selectMode=false; let selected=new Set(); let settingsPage='home';
let cardEls=Object.create(null); let gridEl=null; let emptyEl=null;
let filterTags=new Set(); let filterFrom=''; let filterTo=''; let advOpen=false;
let cardViewMode=localStorage.getItem('simhub_card_view')||'cards';
let maskDefault = localStorage.getItem('simhub_mask')!=='off';
let esimToolTab=localStorage.getItem('simhub_esim_tool_tab')||'parser';
let lpaToolMode='manual'; let toolCameraStream=null; let toolScanTimer=null;
let giffTimeTimer=null;
let giffState={accessToken:'',expiresAt:0,authUrl:'',entryUrl:'',redirectUri:'',member:null,mfaRef:'',mfaSignature:'',lpa:'',parsed:null,applying:false};
const RECENT_MODS_CLEAR_KEY='simhub_recent_mods_clear_at';
const CATEGORY_PRESETS=['主号','接码','银行绑定','流量卡','保号','备用','旅行','其他'];
const EYE='<svg><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYEOFF='<svg><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function safeImgURL(u){try{const x=new URL(String(u||''),location.origin);return x.protocol==='https:'&&(x.hostname==='mzstatic.com'||x.hostname.endsWith('.mzstatic.com'))?x.href:'';}catch(e){return '';}}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.getElementById('toastHost').appendChild(t);setTimeout(()=>t.remove(),1800);}
function icon(name){const icons={
  cards:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/><path d="M7 15h4"/></svg>',
  alert:'<svg viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
  pulse:'<svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 8-6-16-3 8H2"/></svg>',
  list:'<svg viewBox="0 0 24 24"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>',
  edit:'<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  copy:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  trash:'<svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>',
  upload:'<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8 12 3 7 8"/><path d="M12 3v12"/></svg>',
  qr:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3z"/><path d="M20 14h1v1"/><path d="M14 20h1v1"/><path d="M19 19h2v2"/></svg>',
  clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  empty:'<svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="M7.5 4.21 12 6.81l4.5-2.6"/><path d="M7.5 19.79V14.6L3 12"/><path d="m21 12-4.5 2.6v5.19"/><path d="M3.27 6.96 12 12l8.73-5.04"/><path d="M12 22.08V12"/></svg>'
};return icons[name]||icons.empty;}
function emptyState(title,desc,actionLabel='',actionId=''){return `<div class="emptyState"><div class="emptyIcon">${icon('empty')}</div><b>${esc(title)}</b><p>${esc(desc)}</p>${actionLabel?`<button class="sec" id="${esc(actionId)}">${esc(actionLabel)}</button>`:''}</div>`;}
/* 删除确认弹窗(替代浏览器原生 confirm) */
function confirmDelete(message,onConfirm,confirmText='删除'){
  const host=document.getElementById('confirmHost');
  host.innerHTML=`<div class="scrim confirm"><div class="confirmBox">
    <div class="ic">🗑️</div><h3>是否确认删除</h3><p>${esc(message)}</p>
    <div class="confirmActions"><button class="sec" id="cfCancel">取消</button><button class="danger" id="cfOk">${esc(confirmText)}</button></div>
  </div></div>`;
  document.getElementById('cfCancel').onclick=()=>host.innerHTML='';
  document.getElementById('cfOk').onclick=()=>{host.innerHTML='';onConfirm();};
  host.querySelector('.scrim').onclick=e=>{if(e.target.classList.contains('scrim'))host.innerHTML='';};
}
function maskPhone(p){if(!p)return '—';const d=String(p).replace(/\s/g,'');if(d.length<=2)return '••';return '•••• '+d.slice(-2);}

async function api(path,opts={}){
  const timeoutMs=opts.timeoutMs||20000;delete opts.timeoutMs;
  opts.headers=Object.assign({'Content-Type':'application/json','X-CSRF-Token':CSRF},opts.headers||{});
  opts.credentials='same-origin';
  const ctrl=new AbortController();const tid=setTimeout(()=>ctrl.abort(),timeoutMs);opts.signal=ctrl.signal;
  let res;
  try{res=await fetch(API+path,opts);}
  catch(e){clearTimeout(tid);throw{message:e.name==='AbortError'?'请求超时，请稍后再试':'连接已断开,请回到 SIMHUB App 后重试',code:e.name==='AbortError'?'TIMEOUT':'DISCONNECTED'};}
  clearTimeout(tid);
  let body=null;try{body=await res.json();}catch(e){}
  if(res.status===401){location.href='/login';throw{message:'未授权'};}
  if(!res.ok||(body&&body.success===false))throw(body||{message:'请求失败'});
  return body?body.data:null;
}

function logout(){const f=document.createElement('form');f.method='POST';f.action='/logout';const i=document.createElement('input');i.name='csrf_token';i.value=CSRF;f.appendChild(i);document.body.appendChild(f);f.submit();}

document.getElementById('themeBtn').onclick=()=>{const d=!document.body.classList.contains('dark');localStorage.setItem('simhub_theme',d?'dark':'light');document.body.classList.toggle('dark',d);};
applyTheme();

/* 导航 */
document.getElementById('nav').addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;setView(a.dataset.v);document.getElementById('sidebar').classList.remove('open');});

async function enterApp(){await loadStatus();await loadCountries();await loadCards();}

const M=()=>document.getElementById('main');
function render(){ if(view==='cards')renderCards(); else if(view==='tools')renderESIMTools(); else if(view==='io')renderIO(); else if(view==='settings')renderSettings(); else renderOverview(); }

function daysLeft(c){return Math.ceil((new Date(c.expiryDate)-new Date())/86400000);}
function fmtDate(v){if(!v)return '未设置';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleDateString();}
function cardName(c){return c.carrier||c.plan||c.phoneNumber||'未命名';}
function cardCountry(c){return c.countryName||c.flag||'未知地区';}
function statusInfo(c){
  if(!c.expiryDate||c.isLongTerm)return {type:'ok',label:c.isLongTerm?'长期保号':'正常',hint:c.isLongTerm?'长期':'未设置到期'};
  const d=daysLeft(c);
  if(!Number.isFinite(d))return {type:'neutral',label:'未知',hint:'日期异常'};
  if(d<0)return {type:'danger',label:'已过期',hint:`过期 ${-d} 天`};
  if(d<=7)return {type:'warn',label:'即将到期',hint:`剩余 ${d} 天`};
  return {type:'ok',label:'正常',hint:`剩余 ${d} 天`};
}
function statusBadge(c,compact=false){const s=statusInfo(c);return `<span class="statusBadge ${s.type}" title="${esc(s.hint)}">${esc(compact?s.label:s.label)}</span>`;}
function categoryLabel(c){return (c.category||'未分类').trim();}
function categoryChip(c){return `<span class="categoryChip">${esc(categoryLabel(c))}</span>`;}
function percent(n,total){return total?Math.round(n/total*100):0;}
function isoNoMillis(d){return d.toISOString().replace(/\.\d{3}Z$/,'Z');}
function addDays(d,n){const x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
function dateOnlyISO(v){return v?v+'T00:00:00Z':'';}
function daySpan(a,b){const n=Math.round((b-a)/86400000);return Number.isFinite(n)&&n>0?n:30;}
function moneyNumber(v){
  const m=String(v||'').replace(/,/g,'.').match(/-?\d+(?:\.\d+)?/);
  return m?Number(m[0]):0;
}
function billingPeriodDays(c){
  const explicit=Number(c.renewDays||c.renewalIntervalValue);
  if(Number.isFinite(explicit)&&explicit>0)return explicit;
  const a=new Date(c.activationDate), b=new Date(c.expiryDate);
  const span=daySpan(a,b);
  return span>0?span:30;
}
function formatMoney(n,currency){
  if(!Number.isFinite(n))n=0;
  const fixed=n>=100?0:(n>=10?1:2);
  return `${n.toFixed(fixed)} ${currency||'USD'}`;
}
function costSummary(cards){
  const byCurrency={};
  cards.forEach(c=>{
    const amount=moneyNumber(c.price);
    if(!amount)return;
    const currency=(c.currencyCode||'USD').toUpperCase();
    const monthly=amount/billingPeriodDays(c)*30.4375;
    if(!byCurrency[currency])byCurrency[currency]={monthly:0,yearly:0,count:0};
    byCurrency[currency].monthly+=monthly;
    byCurrency[currency].yearly+=monthly*12;
    byCurrency[currency].count+=1;
  });
  return Object.entries(byCurrency).sort((a,b)=>b[1].monthly-a[1].monthly);
}
function upcomingCards(days=90,limit=8){
  return cards.filter(c=>!c.isLongTerm&&Number.isFinite(daysLeft(c))&&daysLeft(c)>=0&&daysLeft(c)<=days)
    .sort((a,b)=>daysLeft(a)-daysLeft(b)).slice(0,limit);
}
function riskItems(limit=8){
  const out=[];
  cards.forEach(c=>{
    const d=daysLeft(c);
    const hasLPA=!!(c.smdpAddress||c.activationCode);
    if(Number.isFinite(d)&&d<0)out.push({card:c,type:'danger',title:'已过期',meta:`${cardName(c)} · ${cardCountry(c)} · 过期 ${-d} 天`});
    else if(Number.isFinite(d)&&d<=7&&!c.isLongTerm)out.push({card:c,type:'warn',title:'即将到期',meta:`${cardName(c)} · ${cardCountry(c)} · 剩余 ${d} 天`});
    if(c.reminderMode==='off'&&!c.isLongTerm)out.push({card:c,type:'warn',title:'提醒关闭',meta:`${cardName(c)} · 到期提醒已关闭`});
    if(hasLPA&&(!c.smdpAddress||!c.activationCode))out.push({card:c,type:'warn',title:'缺少 LPA',meta:`${cardName(c)} · 未完整保存 SM-DP+ / 激活码`});
    if(!c.carrierAppIconURLString&&!c.carrierAppName)out.push({card:c,type:'neutral',title:'缺少运营商 App',meta:`${cardName(c)} · 可补充 App 入口或图标`});
  });
  const order={danger:0,warn:1,neutral:2};
  return out.sort((a,b)=>(order[a.type]??3)-(order[b.type]??3)).slice(0,limit);
}
function recentChangesCutoffTs(){
  const t=Number(localStorage.getItem(RECENT_MODS_CLEAR_KEY)||0);
  return Number.isFinite(t)&&t>0?t:0;
}
function costPanelHTML(){
  const costs=costSummary(cards);

  return `<div class="costList">${costs.map(([currency,v])=>`<div class="costRow"><div><div class="rowTitle">${esc(currency)}</div><div class="rowMeta">${v.count} 张卡参与估算 · 按周期折算</div></div><div class="rowValue">${esc(formatMoney(v.monthly,currency))}<div class="rowMeta">${esc(formatMoney(v.yearly,currency))}/年</div></div></div>`).join('')}</div>`;
}
function timelineHTML(){
  const list=upcomingCards();
  if(!list.length)return emptyState('90 天内暂无到期','到期卡片会按时间线显示，方便提前续费或处理。');
  return `<div class="timelineList">${list.map(c=>`<div class="timelineRow"><div><div class="rowTitle">${esc(cardName(c))}</div><div class="rowMeta">${esc(cardCountry(c))} · ${esc(c.category||'未分类')} · ${esc(statusInfo(c).hint)}</div></div><div class="timelineDate">${esc(fmtDate(c.expiryDate))}</div></div>`).join('')}</div>`;
}
function riskPanelHTML(){
  const items=riskItems();
  if(!items.length)return emptyState('暂无明显风险','没有已过期、近期到期或资料缺失的卡片。');
  return `<div class="riskList">${items.map(x=>`<div class="riskRow"><div class="riskMain"><span class="riskDot ${x.type==='danger'?'danger':''}"></span><div style="min-width:0"><div class="rowTitle">${esc(x.title)}</div><div class="rowMeta">${esc(x.meta)}</div></div></div><button class="sec mini riskOpen" data-card-id="${esc(x.card.id)}">详情</button></div>`).join('')}</div>`;
}

function currentLPAData(){
  const smdp=(dG('lpaSmdp')?.value||'').trim(), activation=(dG('lpaActivation')?.value||'').trim(), confirmation=(dG('lpaConfirmation')?.value||'').trim();
  const lpa=smdp&&activation?`LPA:1$${smdp}$${activation}${confirmation?'$'+confirmation:''}`:'LPA:1$';
  return {smdpAddress:smdp,activationCode:activation,confirmationCode:confirmation,lpa,valid:!!(smdp&&activation)};
}

function updateLPAOutput(){
  const data=currentLPAData(), out=dG('lpaText'), box=dG('qrBox');
  if(out)out.textContent=data.lpa;

  if(dG('copyLPA'))dG('copyLPA').onclick=()=>copyText(data.lpa,'LPA 已复制');
  if(dG('copyIOSUrl'))dG('copyIOSUrl').onclick=()=>copyText(iosInstallURL(data.lpa),'iOS 安装链接已复制');

async function parseLPAString(value,silent=false){
  if(!value)return;
  try{const r=await api('/api/lpa/parse',{method:'POST',body:JSON.stringify({value})});
    applyParsedLPA(r);if(!silent)toast('已解析 LPA');}
  catch(e){if(!silent)toast(e.message||'解析失败');}
}
function applyParsedLPA(r){
  if(dG('lpaSmdp'))dG('lpaSmdp').value=r.smdpAddress||'';
  if(dG('lpaActivation'))dG('lpaActivation').value=r.activationCode||'';
  if(dG('lpaConfirmation'))dG('lpaConfirmation').value=r.confirmationCode||'';
  if(dG('rawLPA'))dG('rawLPA').value=r.lpa||'';
  updateLPAOutput();
}
function clearLPAFields(){['rawLPA','lpaSmdp','lpaActivation','lpaConfirmation'].forEach(id=>{const el=dG(id);if(el)el.value='';});updateLPAOutput();}
function iosInstallURL(lpa){return 'https://esimsetup.apple.com/esim_qrcode_provisioning?carddata='+encodeURIComponent(lpa);}

function openDrawerFromLPA(data){

function clearGiffgaffSession(){
  giffState={accessToken:'',expiresAt:0,authUrl:'',entryUrl:'',redirectUri:'',member:null,mfaRef:'',mfaSignature:'',lpa:'',parsed:null,applying:false};
  renderGiffgaffTools();
}

async function startGiffgaffLogin(){
  try{
    const r=await api('/api/giffgaff/oauth/start',{method:'POST',body:JSON.stringify({})});
    Object.assign(giffState,{authUrl:r.authUrl||'',entryUrl:r.entryUrl||'',redirectUri:r.redirectUri||'',accessToken:'',member:null,mfaRef:'',mfaSignature:''});
    renderGiffgaffTools();
    toast('已生成登录链接');
  }catch(e){toast(e.message||'生成登录链接失败');}
}

async function exchangeGiffgaffToken(){
  const value=(dG('ggCallback')?.value||'').trim();
  if(!value){toast('请粘贴回调 URL 或 code');return;}
  try{
    const r=await api('/api/giffgaff/oauth/token',{method:'POST',body:JSON.stringify({callbackUrl:value}),timeoutMs:30000});
    giffState.accessToken=r.accessToken||'';
    giffState.expiresAt=Date.now()+((+r.expiresIn||3600)*1000);
    giffState.member=null;giffState.mfaRef='';giffState.mfaSignature='';
    renderGiffgaffTools();
    toast('giffgaff 已登录');
  }catch(e){toast(e.message||'换取令牌失败');}
}

async function readGiffgaffMember(){
  try{
    giffState.member=await api('/api/giffgaff/member',{method:'POST',body:JSON.stringify({accessToken:giffState.accessToken}),timeoutMs:30000});
    renderGiffgaffTools();
    toast('已读取账户');
  }catch(e){toast(e.message||'读取账户失败');}
}

async function sendGiffgaffMfa(){
  try{
    const r=await api('/api/giffgaff/mfa/challenge',{method:'POST',body:JSON.stringify({accessToken:giffState.accessToken}),timeoutMs:30000});
    giffState.mfaRef=r.ref||'';giffState.mfaSignature='';
    renderGiffgaffTools();
    toast('验证码已发送');
  }catch(e){toast(e.message||'发送验证码失败');}
}

async function verifyGiffgaffMfa(){
  const code=(dG('ggCode')?.value||'').trim();
  if(!code){toast('请输入邮件验证码');return;}
  try{
    const r=await api('/api/giffgaff/mfa/verify',{method:'POST',body:JSON.stringify({accessToken:giffState.accessToken,ref:giffState.mfaRef,code}),timeoutMs:30000});
    giffState.mfaSignature=r.signature||'';
    renderGiffgaffTools();
    toast('邮件验证通过');
  }catch(e){toast(e.message||'验证失败');}
}

async function applyGiffgaffEsim(){
  if(!confirm('确认执行 giffgaff SIM swap 并转换为 eSIM?'))return;
  const memberId=((giffState.member||{}).memberProfile||{}).id||'';
  giffState.applying=true;renderGiffgaffTools();
  try{
    const r=await api('/api/giffgaff/esim/apply',{method:'POST',body:JSON.stringify({accessToken:giffState.accessToken,memberId,mfaSignature:giffState.mfaSignature,mfaRef:giffState.mfaRef}),timeoutMs:90000});
    giffState.lpa=r.lpa||'';giffState.parsed=r.parsed||null;giffState.applying=false;
    renderGiffgaffTools();
    toast('giffgaff eSIM 已生成');
  }catch(e){giffState.applying=false;renderGiffgaffTools();toast(e.message||'转换失败');}
}

function renderGiffgaffOutput(){
  const box=dG('ggQrBox'), text=dG('ggLpaText');
  if(text)text.textContent=giffState.lpa||'LPA:1$';
  if(!box)return;
  if(!giffState.lpa){box.innerHTML='<span class="sub">转换完成后显示二维码</span>';return;}
  const svg=makeQRSVG(giffState.lpa);
  box.innerHTML=svg||'<span class="sub">LPA 太长，当前本地二维码生成器暂不支持；仍可复制 LPA 字符串。</span>';
}

function openDrawerFromGiffgaff(){
  const p=giffState.parsed||{};
  if(!p.smdpAddress||!p.activationCode){toast('缺少完整 LPA');return;}
  openDrawer(Object.assign(defaultCardSeed(),{carrier:'giffgaff',countryCode:'GB',countryName:'英国',smdpAddress:p.smdpAddress,activationCode:p.activationCode,confirmationCode:p.confirmationCode||''}));
}

function updateGiffTimeStatus(){

  const info=giffLondonWindow();
  el.className='giffStatus '+(info.open?'ok':'warn');
  el.textContent=`英国时间 ${info.time} · ${info.open?'服务窗口内':'不在建议窗口内'}`;

function giffLondonWindow(){
  const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
  const hour=+(parts.find(x=>x.type==='hour')||{}).value||0, minute=+(parts.find(x=>x.type==='minute')||{}).value||0;
  const total=hour*60+minute, start=4*60+30, end=21*60+30;
  return {time:String(hour).padStart(2,'0')+':'+String(minute).padStart(2,'0'),open:total>=start&&total<=end};
}

async function detectQRFile(file){
  const msg=dG('qrDetectMsg');if(msg)msg.textContent='正在识别图片…';
  try{
    const text=await detectBarcodeFromImage(file);
    if(!text)throw new Error('未识别到二维码');
    await parseLPAString(text);
    if(msg)msg.textContent='已识别并解析二维码。';
  }catch(e){if(msg)msg.textContent=e.message||'识别失败';}
}
async function detectBarcodeFromImage(file){
  if(!('BarcodeDetector' in window))throw new Error('当前浏览器不支持图片二维码识别，请改用手动粘贴。');
  const detector=new BarcodeDetector({formats:['qr_code']});
  const bitmap=await createImageBitmap(file);
  const codes=await detector.detect(bitmap);
  if(bitmap.close)bitmap.close();
  return (codes[0]&&codes[0].rawValue)||'';
}
async function startToolCamera(){
  const msg=dG('qrDetectMsg'), video=dG('qrVideo');
  if(!('BarcodeDetector' in window)){if(msg)msg.textContent='当前浏览器不支持摄像头二维码识别。';return;}
  try{
    stopToolCamera();
    toolCameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    video.srcObject=toolCameraStream;await video.play();
    const detector=new BarcodeDetector({formats:['qr_code']});
    if(msg)msg.textContent='扫描中，对准 eSIM 二维码。';
    toolScanTimer=setInterval(async()=>{try{const codes=await detector.detect(video);if(codes[0]&&codes[0].rawValue){stopToolCamera();await parseLPAString(codes[0].rawValue);if(msg)msg.textContent='已识别并解析二维码。';}}catch(e){}},700);
  }catch(e){if(msg)msg.textContent='无法打开摄像头，请检查权限或使用图片识别。';}
}
function stopToolCamera(){
  if(toolScanTimer){clearInterval(toolScanTimer);toolScanTimer=null;}
  if(toolCameraStream){toolCameraStream.getTracks().forEach(t=>t.stop());toolCameraStream=null;}
  const video=document.getElementById('qrVideo');if(video)video.srcObject=null;
}

function makeQRSVG(text){
  const bytes=[...new TextEncoder().encode(text)];
  const spec=qrChooseSpec(bytes.length);
  if(!spec)return '';
  const size=spec.version*4+17, base=Array.from({length:size},()=>Array(size).fill(false)), func=Array.from({length:size},()=>Array(size).fill(false));
  const setFunction=(x,y,v)=>{if(x>=0&&x<size&&y>=0&&y<size){base[y][x]=!!v;func[y][x]=true;}};
  const finder=(x,y)=>{for(let dy=-1;dy<=7;dy++)for(let dx=-1;dx<=7;dx++){const xx=x+dx,yy=y+dy;if(xx<0||xx>=size||yy<0||yy>=size)continue;const v=dx>=0&&dx<=6&&dy>=0&&dy<=6&&(dx===0||dx===6||dy===0||dy===6||(dx>=2&&dx<=4&&dy>=2&&dy<=4));setFunction(xx,yy,v);}};
  finder(0,0);finder(size-7,0);finder(0,size-7);
  for(let i=8;i<size-8;i++){setFunction(i,6,i%2===0);setFunction(6,i,i%2===0);}
  for(const y of spec.align)for(const x of spec.align){if((x===6&&y===6)||(x===6&&y===size-7)||(x===size-7&&y===6))continue;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)setFunction(x+dx,y+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1);}
  reserveFormatAndVersion();
  const codewords=qrCodewords(bytes,spec), dataBits=[];codewords.forEach(b=>pushBits(dataBits,b,8));
  let modules=null,bestPenalty=Infinity;
  for(let mask=0;mask<8;mask++){
    const trial=base.map(row=>row.slice());
    placeData(trial,dataBits,mask);
    drawFormat(trial,mask);
    if(spec.version>=7)drawVersion(trial);
    const penalty=qrPenalty(trial);
    if(penalty<bestPenalty){bestPenalty=penalty;modules=trial;}
  }
  const q=4, cell=8, dim=(size+q*2)*cell;let out=`<svg viewBox="0 0 ${dim} ${dim}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LPA QR"><rect width="${dim}" height="${dim}" fill="#fff"/>`;
  for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(modules[y][x])out+=`<rect x="${(x+q)*cell}" y="${(y+q)*cell}" width="${cell}" height="${cell}" fill="#000"/>`;
  return out+'</svg>';
  function reserveFormatAndVersion(){for(let i=0;i<6;i++)setFunction(8,i,false);setFunction(8,7,false);setFunction(8,8,false);setFunction(7,8,false);for(let i=9;i<15;i++)setFunction(14-i,8,false);for(let i=0;i<8;i++)setFunction(size-1-i,8,false);for(let i=8;i<15;i++)setFunction(8,size-15+i,false);setFunction(8,size-8,true);if(spec.version>=7){for(let i=0;i<18;i++){const a=size-11+i%3,b=Math.floor(i/3);setFunction(a,b,false);setFunction(b,a,false);}}}
  function pushBits(arr,val,len){for(let i=len-1;i>=0;i--)arr.push((val>>>i)&1);}
  function qrCodewords(payload,s){
    const dataLen=s.blocks.reduce((sum,b)=>sum+b[0]*b[2],0),bits=[],countBits=s.version<10?8:16;
    pushBits(bits,4,4);pushBits(bits,payload.length,countBits);payload.forEach(b=>pushBits(bits,b,8));
    const cap=dataLen*8;for(let i=0;i<Math.min(4,cap-bits.length);i++)bits.push(0);while(bits.length%8)bits.push(0);
    const data=[];for(let i=0;i<bits.length;i+=8){let v=0;for(let j=0;j<8;j++)v=(v<<1)|(bits[i+j]||0);data.push(v);}
    for(let p=0;data.length<dataLen;p++)data.push(p%2?0x11:0xec);
    const blocks=[];let offset=0;
    for(const group of s.blocks)for(let i=0;i<group[0];i++){const total=group[1],len=group[2],chunk=data.slice(offset,offset+len);offset+=len;blocks.push({data:chunk,ecc:qrRsRemainder(chunk,total-len)});}
    const result=[],maxData=Math.max(...blocks.map(b=>b.data.length)),maxEcc=Math.max(...blocks.map(b=>b.ecc.length));
    for(let i=0;i<maxData;i++)for(const b of blocks)if(i<b.data.length)result.push(b.data[i]);
    for(let i=0;i<maxEcc;i++)for(const b of blocks)if(i<b.ecc.length)result.push(b.ecc[i]);
    return result;
  }
  function placeData(m,bits,mask){let bi=0,up=true;for(let right=size-1;right>=1;right-=2){if(right===6)right--;for(let vert=0;vert<size;vert++){const y=up?size-1-vert:vert;for(let j=0;j<2;j++){const x=right-j;if(func[y][x])continue;let dark=bi<bits.length?bits[bi++]!==0:false;if(qrMask(mask,x,y))dark=!dark;m[y][x]=dark;}}up=!up;}}
  function drawFormat(m,mask){const bits=qrBchFormat((spec.formatBits<<3)|mask),bit=i=>((bits>>>i)&1)!==0;for(let i=0;i<6;i++)m[i][8]=bit(i);m[7][8]=bit(6);m[8][8]=bit(7);m[8][7]=bit(8);for(let i=9;i<15;i++)m[8][14-i]=bit(i);for(let i=0;i<8;i++)m[8][size-1-i]=bit(i);for(let i=8;i<15;i++)m[size-15+i][8]=bit(i);m[size-8][8]=true;}
  function drawVersion(m){const bits=qrBchVersion(spec.version),bit=i=>((bits>>>i)&1)!==0;for(let i=0;i<18;i++){const a=size-11+i%3,b=Math.floor(i/3);m[b][a]=bit(i);m[a][b]=bit(i);}}
  function qrChooseSpec(byteLen){
    const align=[[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50]];
    const q=[[[1,26,13]],[[1,44,22]],[[2,35,17]],[[2,50,24]],[[2,33,15],[2,34,16]],[[4,43,19]],[[2,32,14],[4,33,15]],[[4,40,18],[2,41,19]],[[4,36,16],[4,37,17]],[[6,43,19],[2,44,20]]];
    const l=[[[1,26,19]],[[1,44,34]],[[1,70,55]],[[1,100,80]],[[1,134,108]],[[2,86,68]],[[2,98,78]],[[2,121,97]],[[2,146,116]],[[2,86,68],[2,87,69]]];
    for(const cfg of [{blocks:q,formatBits:3},{blocks:l,formatBits:1}]){
      for(let i=0;i<cfg.blocks.length;i++){const version=i+1,countBits=version<10?8:16,dataLen=cfg.blocks[i].reduce((sum,b)=>sum+b[0]*b[2],0);if(byteLen<(1<<countBits)&&4+countBits+byteLen*8<=dataLen*8)return{version,align:align[i],blocks:cfg.blocks[i],formatBits:cfg.formatBits};}
    }
    return null;
  }
  function qrGfMul(x,y){let z=0;for(let i=7;i>=0;i--){z=(z<<1)^(((z>>>7)&1)?0x11d:0);if(((y>>>i)&1)!==0)z^=x;}return z;}
  function qrRsDivisor(deg){const res=Array(deg).fill(0);res[deg-1]=1;let root=1;for(let i=0;i<deg;i++){for(let j=0;j<deg;j++){res[j]=qrGfMul(res[j],root);if(j+1<deg)res[j]^=res[j+1];}root=qrGfMul(root,2);}return res;}
  function qrRsRemainder(data,deg){const div=qrRsDivisor(deg),res=Array(deg).fill(0);for(const b of data){const factor=b^res.shift();res.push(0);for(let i=0;i<deg;i++)res[i]^=qrGfMul(div[i],factor);}return res;}
  function qrBchFormat(data){let rem=data;for(let i=0;i<10;i++)rem=(rem<<1)^(((rem>>>9)&1)?0x537:0);return ((data<<10)|rem)^0x5412;}
  function qrBchVersion(version){let rem=version;for(let i=0;i<12;i++)rem=(rem<<1)^(((rem>>>11)&1)?0x1f25:0);return(version<<12)|rem;}
  function qrMask(mask,x,y){switch(mask){case 0:return(x+y)%2===0;case 1:return y%2===0;case 2:return x%3===0;case 3:return(x+y)%3===0;case 4:return(Math.floor(y/2)+Math.floor(x/3))%2===0;case 5:return((x*y)%2+(x*y)%3)===0;case 6:return(((x*y)%2+(x*y)%3)%2)===0;default:return(((x+y)%2+(x*y)%3)%2)===0;}}
  function qrPenalty(m){let p=0,dark=0,total=size*size;for(let y=0;y<size;y++){let runColor=m[y][0],run=1;for(let x=1;x<size;x++){if(m[y][x]===runColor)run++;else{if(run>=5)p+=run-2;runColor=m[y][x];run=1;}}if(run>=5)p+=run-2;}for(let x=0;x<size;x++){let runColor=m[0][x],run=1;for(let y=1;y<size;y++){if(m[y][x]===runColor)run++;else{if(run>=5)p+=run-2;runColor=m[y][x];run=1;}}if(run>=5)p+=run-2;}for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=m[y][x];if(c===m[y][x+1]&&c===m[y+1][x]&&c===m[y+1][x+1])p+=3;}const pat=[true,false,true,true,true,false,true,false,false,false,false];for(let y=0;y<size;y++)for(let x=0;x<=size-11;x++){let ok=true,inv=true;for(let k=0;k<11;k++){if(m[y][x+k]!==pat[k])ok=false;if(m[y][x+k]===pat[k])inv=false;}if(ok||inv)p+=40;}for(let x=0;x<size;x++)for(let y=0;y<=size-11;y++){let ok=true,inv=true;for(let k=0;k<11;k++){if(m[y+k][x]!==pat[k])ok=false;if(m[y+k][x]===pat[k])inv=false;}if(ok||inv)p+=40;}for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(m[y][x])dark++;return p+Math.floor(Math.abs(dark*20-total*10)/total)*10;}
}

function fmtTime(s){if(!s)return '';let d=new Date(s.replace(' ','T')+(/[zZ]$/.test(s)?'':'Z'));return isNaN(d)?s:d.toLocaleString();}
async function loadActivity(){
  const host=dG('actList');if(!host)return;
  try{const acts=await api('/api/activity')||[];
    if(!acts.length){
      host.innerHTML=emptyState('暂无活动','卡片新增、编辑、导入等操作会显示在这里。','前往卡片管理','goCardsFromEmpty');
      const btn=dG('goCardsFromEmpty');if(btn)btn.onclick=()=>setView('cards');
      return;
    }
    const ic={create:'+',edit:'✎',delete:'✕',import:'↓'};
    host.innerHTML=acts.slice(0,15).map(a=>`<div class="act"><div class="ai ${esc(a.action)}">${ic[a.action]||'•'}</div><div class="at"><b>${esc(a.label||'—')}</b> <span class="as">${esc(a.note||a.action)}</span></div><span class="as">${esc(fmtTime(a.createdAt))}</span></div>`).join('');
  }catch(e){host.innerHTML='<span class="sub">加载失败</span>';}
}
async function clearActivity(){
  if(!confirm('确定清除最近活动记录吗?'))return;
  const btn=dG('actClear');if(btn){btn.disabled=true;btn.textContent='清除中…';}
  try{await api('/api/activity',{method:'DELETE'});toast('已清除最近活动');loadActivity();}
  catch(e){toast(e.message||'清除失败');}
  finally{if(btn){btn.disabled=false;btn.textContent='清除';}}
}
function clearRecentChanges(){
  if(!confirm('确定清除最近修改列表吗?'))return;
  localStorage.setItem(RECENT_MODS_CLEAR_KEY,String(Date.now()));
  render();
}

  const eye=c.phoneNumber?`<button class="iconbtn eyebtn">${rev?EYEOFF:EYE}</button>`:'';
  const appIcon=safeImgURL(c.carrierAppIconURLString);
  const iconHtml=appIcon?`<img src="${esc(appIcon)}" class="appicon" style="width:30px;height:30px">`:`<span class="flag">${esc(c.flag||'🌐')}</span>`;
  const s=statusInfo(c);

    <div class="cardIdentity">${iconHtml}<div style="min-width:0"><div class="cardTitle">${esc(cardName(c))}</div><div class="cardCountry">${esc(cardCountry(c))}</div></div></div>
    ${statusBadge(c)}
  </div>
  <div class="cardMetaLine"><div class="cardMetaMain">${categoryChip(c)}<span>${esc(c.plan||c.transactionNotes||'未设置套餐')}</span></div><b class="phone">${phoneTxt}${eye}</b></div>
  <div class="cardFoot"><div class="cardDue"><div><span>到期</span><b>${esc(fmtDate(c.expiryDate))}</b></div><div><span>状态</span><b>${esc(s.hint)}</b></div></div><span class="quickActions">
    <button class="iconbtn quickEdit" title="编辑" aria-label="编辑">${icon('edit')}</button>
    <button class="iconbtn quickCopy" title="复制号码" aria-label="复制号码">${icon('copy')}</button>

function ensureCardEl(c){
  let el=cardEls[c.id];
  if(!el){
    el=document.createElement('div');el.dataset.id=c.id;
    el.innerHTML=`<div class="card-content"></div><div class="selcheck"></div><button class="iconbtn moreBtn" aria-label="详情">⋯</button>`;
    el.addEventListener('click',(ev)=>{const id=el.dataset.id;
      if(ev.target.closest('.eyebtn')){ev.stopPropagation();toggleEye(id);return;}
      if(ev.target.closest('.quickEdit')){ev.stopPropagation();const c=cards.find(x=>x.id===id);if(c)openDrawer(c);return;}
      if(ev.target.closest('.quickCopy')){ev.stopPropagation();copyCardPhone(id);return;}
      if(ev.target.closest('.quickDelete')){ev.stopPropagation();const c=cards.find(x=>x.id===id);if(c)delCard(c);return;}
      if(ev.target.closest('.moreBtn')){ev.stopPropagation();openDetailById(id);return;}
      selectMode?toggleSel(id):openDetailById(id);});
    cardEls[c.id]=el;
  }
  return el;
}
function updateCardEl(el,c){
  const bg=bgByAsset[c.cardBackgroundAssetName];
  el.className='card'+(bg?' hasbg':'')+(selected.has(c.id)?' sel':'');
  let bgEl=el.querySelector('.card-bg'),shadeEl=el.querySelector('.card-shade');
  if(bg){
    if(!bgEl){bgEl=document.createElement('div');bgEl.className='card-bg';el.insertBefore(bgEl,el.firstChild);}
    if(bgEl.dataset.bg!==bg){bgEl.style.backgroundImage="url('"+bg+"')";bgEl.dataset.bg=bg;}
    if(!shadeEl){shadeEl=document.createElement('div');shadeEl.className='card-shade';el.insertBefore(shadeEl,bgEl.nextSibling);}
  }else{if(bgEl)bgEl.remove();if(shadeEl)shadeEl.remove();}
  el.querySelector('.card-content').innerHTML=cardContentInner(c);
  el.querySelector('.selcheck').textContent=selected.has(c.id)?'✓':'';
}
function toggleEye(id){if(revealed.has(id))revealed.delete(id);else revealed.add(id);const el=cardEls[id];const c=cards.find(x=>x.id===id);if(el&&c)el.querySelector('.card-content').innerHTML=cardContentInner(c);}
async function copyCardPhone(id){
  const c=cards.find(x=>x.id===id);if(!c||!c.phoneNumber)return toast('这张卡没有号码');
  try{await navigator.clipboard.writeText(c.phoneNumber);toast('号码已复制');}
  catch(e){toast('复制失败');}
}

function filteredCards(){
  const q=(document.getElementById('search')?.value||'').toLowerCase();
  const country=document.getElementById('fCountry')?.value||'';
  const status=document.getElementById('fStatus')?.value||'';
  const carrier=document.getElementById('fCarrier')?.value||'';
  const category=document.getElementById('fCategory')?.value||'';
  const sort=document.getElementById('fSort')?.value||'order';
  let list=cards.filter(c=>{
    if(q&&![c.carrier,c.countryName,c.phoneNumber,c.plan,c.category].join(' ').toLowerCase().includes(q))return false;
    if(country&&(c.countryName||'')!==country)return false;
    if(carrier&&(c.carrier||'')!==carrier)return false;
    if(category&&categoryLabel(c)!==category)return false;
    if(filterTags.size&&!(c.tags||[]).some(t=>filterTags.has(t)))return false;
    if(filterFrom&&c.expiryDate&&new Date(c.expiryDate)<new Date(filterFrom))return false;
    if(filterTo&&c.expiryDate&&new Date(c.expiryDate)>new Date(filterTo+'T23:59:59'))return false;
    const d=daysLeft(c);
    if(status==='exp'&&d>=0)return false;
    if(status==='soon'&&!(d>=0&&d<=7))return false;
    if(status==='active'&&d<0)return false;
    return true;
  });
  if(sort==='expiry')list.sort((a,b)=>new Date(a.expiryDate)-new Date(b.expiryDate));
  else if(sort==='carrier')list.sort((a,b)=>(a.carrier||'').localeCompare(b.carrier||''));
  else list.sort((a,b)=>(a.orderIndex||0)-(b.orderIndex||0));
  return list;
}

function renderIO(){
  M().innerHTML=`
    <div class="panel"><div class="sectionHead"><div><h3>导出 JSON</h3><p class="sub" style="margin:4px 0 0">导出全部卡片数据为 JSON 文件，可用于备份或迁移。</p></div><button id="expBtn">导出 JSON</button></div></div>

      <div class="drop" id="drop">${icon('upload')}<strong>拖拽 JSON 文件到此处，或选择文件</strong><small>支持 SIMHUB 导出的 JSON；导入时会去重并生成预览。</small><label style="color:var(--accent);cursor:pointer;font-weight:800">选择文件<input id="file" type="file" accept=".json,application/json" class="hidden"></label></div>
      <div id="impError"></div>
      <div id="impPreview"></div></div>`;
  document.getElementById('expBtn').onclick=doExport;
  const drop=document.getElementById('drop');const file=document.getElementById('file');
  file.onchange=()=>file.files[0]&&readImport(file.files[0]);
  ['dragover','dragenter'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('over');}));
  ['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('over');}));
  drop.addEventListener('drop',ev=>{const f=ev.dataTransfer.files[0];if(f)readImport(f);});
}
async function doExport(){
  try{const res=await fetch(API+'/api/export',{credentials:'same-origin'});const blob=await res.blob();
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='simhub-export.json';a.click();}catch(e){toast('导出失败');}
}
let importCards=null;
function readImport(f){
  const err=dG('impError');if(err)err.innerHTML='';
  if(!f.name.toLowerCase().endsWith('.json')&&f.type!=='application/json'){if(err)err.innerHTML='<div class="importError">文件类型错误，请选择 JSON 文件。</div>';return;}
  if(f.size>MAX_IMPORT_BYTES){if(err)err.innerHTML='<div class="importError">文件过大，单次导入请控制在 8MB 以内。</div>';return;}
  const r=new FileReader();r.onload=async()=>{
    let arr;try{arr=JSON.parse(r.result);if(!Array.isArray(arr))throw 0;}catch(e){if(err)err.innerHTML='<div class="importError">JSON 格式错误，请检查文件内容。</div>';return;}
    if(arr.length>1000){if(err)err.innerHTML='<div class="importError">一次最多导入 1000 张卡片，请拆分文件后再导入。</div>';return;}
    try{const p=await api('/api/import',{method:'POST',body:JSON.stringify({mode:'preview',cards:arr})});importCards=arr;
      document.getElementById('impPreview').innerHTML=importPreviewHTML(p);
      document.getElementById('commitBtn').onclick=commitImport;
    }catch(e){if(err)err.innerHTML=`<div class="importError">${esc(e.message||'解析失败')}</div>`;}
  };r.readAsText(f);
}
function importPreviewHTML(p){
  const s=p.summary||{}, d=s.duplicates||{}, dupTotal=Object.values(d).reduce((a,b)=>a+(+b||0),0);
  const fields=p.fields||{}, rows=p.rows||[];
  const reason={ready:'可导入',missingCarrier:'缺运营商',id:'ID 重复',phoneNumber:'号码重复',eid:'EID 重复',activation:'激活码重复'};
  return `<div class="previewBox" style="display:block">
    <div class="sectionHead"><div><b>iOS / SIMHUB JSON 导入预览</b><div class="sub" style="margin-top:3px">共识别 ${p.count||0} 张卡片；确认后仅写入可导入项目，不会覆盖现有数据库。</div></div><button id="commitBtn" ${s.ready?'' :'disabled'}>确认导入 ${s.ready||0} 张</button></div>
    <div class="previewGrid">
      <div class="previewStat"><b>${s.ready||0}</b><span>可导入</span></div>
      <div class="previewStat"><b>${dupTotal}</b><span>重复风险</span></div>
      <div class="previewStat"><b>${s.withLPA||0}</b><span>含 LPA 激活信息</span></div>
      <div class="previewStat"><b>${s.withMoney||0}</b><span>含金额 / 余额</span></div>
    </div>
    <div class="previewFields">${(fields.recognized||[]).slice(0,36).map(f=>`<span class="fieldChip">${esc(f)}</span>`).join('')||'<span class="sub">未识别到兼容字段</span>'}</div>
    ${(fields.unknown||[]).length?`<div class="importError" style="margin-top:12px">发现未知字段：${fields.unknown.slice(0,10).map(esc).join('、')}${fields.unknown.length>10?' 等':''}。导入时会保留兼容字段，未知字段会被忽略。</div>`:''}
    <div class="previewRows">${rows.map(r=>`<div class="previewRow"><div><b>${esc(r.flag||'🌐')} ${esc(r.carrier||'未命名')}</b><br><span>${esc([r.country,r.plan,r.hasLPA?'LPA':null].filter(Boolean).join(' · ')||'—')}</span></div><span class="statusBadge ${r.status==='ready'?'ok':'warn'}">${esc(reason[r.status]||r.status)}</span></div>`).join('')||'<div class="previewRow"><span class="sub">没有可预览的卡片</span></div>'}</div>
  </div>`;
}
async function commitImport(){
  try{const r=await api('/api/import',{method:'POST',body:JSON.stringify({mode:'commit',cards:importCards})});
    toast('导入 '+r.imported+' 张,跳过 '+r.skipped+' 张');importCards=null;document.getElementById('impPreview').innerHTML='';await loadCards();}catch(e){toast(e.message);}
}

function nonnegativeIntInput(id,fallback,label){
  const raw=(dG(id).value||'').trim();
  if(raw==='')return fallback;
  if(!/^-?\d+$/.test(raw))throw new Error(label+'必须是数字');
  return Math.max(parseInt(raw,10),0);
}
function portInput(id,fallback){
  const raw=(dG(id).value||'').trim();
  if(raw==='')return fallback;
  if(!/^\d+$/.test(raw))throw new Error('端口必须是数字');
  const port=parseInt(raw,10);
  if(port<1||port>65535)throw new Error('端口必须在 1-65535 之间');
  return port;
}

async function save(orig,isNew){
  const btn=dG('saveBtn');btn.disabled=true;btn.textContent='保存中…';
  const v=id=>(dG(id)?dG(id).value:'');
  const skipLPA=!!(dG('f_skipLPA')&&dG('f_skipLPA').checked);
  const skipEID=!!(dG('f_skipEID')&&dG('f_skipEID').checked);
  const start=dateOnlyISO(v('f_start'))||drawerData.activationDate;
  const expiry=dateOnlyISO(v('f_expiry'))||drawerData.expiryDate;
  const reminderMode=v('f_reminderMode')||'default';
  const p=Object.assign({},drawerData,{
    carrier:v('f_carrier'),plan:v('f_plan'),category:v('f_category'),price:v('f_price'),currencyCode:v('f_currencyCode')||'USD',
    phoneNumber:v('f_phoneNumber'),websiteURL:v('f_websiteURL'),currentBalance:v('f_currentBalance'),
    transactionNotes:v('f_transactionNotes'),customPrompt:v('f_customPrompt'),
    smdpAddress:skipLPA?'':v('f_smdpAddress'),activationCode:skipLPA?'':v('f_activationCode'),
    confirmationCode:skipLPA?'':v('f_confirmationCode'),eid:skipEID?'':v('f_eid'),
    tags:v('f_tags').split(',').map(s=>s.trim()).filter(Boolean),
    activationDate:start,expiryDate:expiry,
    isLongTerm:dG('f_longterm').checked,
    reminderMode,
    reminderDaysBefore:reminderMode==='custom'?v('f_reminderDaysBefore'):null,
    operationReminderEnabled:dG('f_operationEnabled').checked,
    operationDate:v('f_operationDate')?dateOnlyISO(v('f_operationDate')):null,
    operationDaysBeforeExpiry:v('f_operationDaysBeforeExpiry'),
    operationNote:v('f_operationNote'),
    renewDays:daySpan(new Date(start),new Date(expiry)),
    createdAt:drawerData.createdAt||isoNoMillis(new Date())
  });
  p.renewalIntervalValue=p.renewDays;p.renewalUnit='days';
  try{
    if(isNew){delete p.id;await api('/api/cards',{method:'POST',body:JSON.stringify(p)});}
    else await api('/api/cards/'+orig.id,{method:'PUT',body:JSON.stringify(p)});
    document.getElementById('drawerHost').innerHTML='';toast('已保存');await loadCards();
  }catch(e){btn.disabled=false;btn.textContent='保存';
    if(e.code==='CONFLICT'){if(confirm('App 内这张卡已被修改。重新加载最新数据?')){document.getElementById('drawerHost').innerHTML='';await loadCards();}}
    else toast(e.message||'保存失败');}
}

let activeDateInput=null;
let datePickerMonth=null;
let datePickerMode='grid';
let wheelScrollTimer=null;
function parseDateValue(value){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(value||'');
  if(!m)return null;
  const d=new Date(+m[1],+m[2]-1,+m[3]);
  return Number.isNaN(d.getTime())?null:d;
}
function pad2(n){return String(n).padStart(2,'0');}
function dateValue(d){return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;}
function sameDate(a,b){return a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function datePickerHost(){
  let host=document.getElementById('datePickerHost');
  if(!host){host=document.createElement('div');host.id='datePickerHost';host.className='datePickerHost';document.body.appendChild(host);}
  return host;
}
function openDatePicker(input){
  activeDateInput=input;
  const base=parseDateValue(input.value)||new Date();
  datePickerMonth=new Date(base.getFullYear(),base.getMonth(),1);
  datePickerMode='grid';
  renderDatePicker();
}
function closeDatePicker(){
  const host=document.getElementById('datePickerHost');
  if(host)host.remove();
  activeDateInput=null;datePickerMonth=null;datePickerMode='grid';
}
function placeDatePicker(host){
  if(!activeDateInput)return;
  const box=host.firstElementChild, rect=activeDateInput.getBoundingClientRect();
  const w=box?box.offsetWidth:360, h=box?box.offsetHeight:410, gap=10;
  const maxLeft=Math.max(12,window.innerWidth-w-12);
  const left=Math.min(Math.max(12,rect.left),maxLeft);
  let top=rect.bottom+gap;
  if(top+h>window.innerHeight-12)top=Math.max(12,rect.top-h-gap);
  host.style.left=left+'px';host.style.top=top+'px';
}
function renderDatePicker(){
  if(!activeDateInput||!document.body.contains(activeDateInput))return closeDatePicker();
  if(datePickerMode==='wheel')return renderDateWheel();
  renderDateGrid();
}
function renderDateGrid(){
  if(!activeDateInput||!document.body.contains(activeDateInput))return closeDatePicker();
  const host=datePickerHost(), y=datePickerMonth.getFullYear(), m=datePickerMonth.getMonth();
  const selected=parseDateValue(activeDateInput.value), today=new Date();
  const first=new Date(y,m,1), offset=first.getDay();
  const cells=[];
  for(let i=0;i<42;i++){
    const d=new Date(y,m,i-offset+1), out=d.getMonth()!==m;
    const cls=['glassCalDay',out?'out':'',sameDate(d,today)?'today':'',sameDate(d,selected)?'sel':''].filter(Boolean).join(' ');
    cells.push(`<button type="button" class="${cls}" data-date-value="${dateValue(d)}">${d.getDate()}</button>`);
  }
  host.innerHTML=`<div class="glassCal">
    <div class="glassCalHead"><button type="button" class="glassCalTitle" data-date-action="toggle-wheel">${y}年 ${m+1}月</button><div class="glassCalNav"><button type="button" data-date-action="prev" aria-label="上个月">‹</button><button type="button" data-date-action="next" aria-label="下个月">›</button></div></div>
    <div class="glassCalWeek">${['日','一','二','三','四','五','六'].map(x=>`<span>${x}</span>`).join('')}</div>
    <div class="glassCalGrid">${cells.join('')}</div>
    <div class="glassCalFoot"><button type="button" data-date-action="clear">清空</button><button type="button" data-date-action="today">今天</button></div>
  </div>`;
  placeDatePicker(host);
}
function renderDateWheel(){
  if(!activeDateInput||!document.body.contains(activeDateInput))return closeDatePicker();
  const host=datePickerHost(), y=datePickerMonth.getFullYear(), m=datePickerMonth.getMonth();
  const years=[];for(let yy=y-80;yy<=y+80;yy++)years.push(yy);
  const yearItems=years.map(yy=>`<button type="button" class="wheelItem ${yy===y?'sel':''}" data-wheel-type="year" data-wheel-value="${yy}">${yy}年</button>`).join('');
  const monthItems=Array.from({length:12},(_,i)=>`<button type="button" class="wheelItem ${i===m?'sel':''}" data-wheel-type="month" data-wheel-value="${i}">${i+1}月</button>`).join('');
  host.innerHTML=`<div class="glassCal wheelMode">
    <div class="glassCalHead"><button type="button" class="glassCalTitle wheel" data-date-action="toggle-wheel">${y}年 ${m+1}月</button><div class="glassCalNav"><button type="button" data-date-action="wheel-done">完成</button></div></div>
    <div class="glassCalWheel"><div class="glassCalWheelMark"></div><div class="wheelCol" data-wheel-type="year">${yearItems}</div><div class="wheelCol" data-wheel-type="month">${monthItems}</div></div>
    <div class="glassCalFoot"><button type="button" data-date-action="clear">清空</button><button type="button" data-date-action="today">今天</button></div>
  </div>`;
  placeDatePicker(host);
  requestAnimationFrame(()=>{host.querySelectorAll('.wheelItem.sel').forEach(el=>el.scrollIntoView({block:'center'}));});
}
function setWheelValue(type,value){
  const nextYear=type==='year'?+value:datePickerMonth.getFullYear();
  const nextMonth=type==='month'?+value:datePickerMonth.getMonth();
  if(nextYear===datePickerMonth.getFullYear()&&nextMonth===datePickerMonth.getMonth())return;
  datePickerMonth=new Date(nextYear,nextMonth,1);
  renderDateWheel();
}
function settleWheelColumn(col){
  const items=[...col.querySelectorAll('.wheelItem')];
  const center=col.getBoundingClientRect().top+col.clientHeight/2;
  let best=items[0], dist=Infinity;
  items.forEach(el=>{const r=el.getBoundingClientRect();const d=Math.abs((r.top+r.height/2)-center);if(d<dist){dist=d;best=el;}});
  if(best)setWheelValue(best.dataset.wheelType,best.dataset.wheelValue);
}
function setDateInputValue(value){
  if(!activeDateInput)return;
  activeDateInput.value=value;
  activeDateInput.dispatchEvent(new Event('input',{bubbles:true}));
  activeDateInput.dispatchEvent(new Event('change',{bubbles:true}));
  activeDateInput.focus();
}
document.addEventListener('click',e=>{
  const input=e.target.closest&&e.target.closest('[data-date-picker]');
  if(input){e.preventDefault();openDatePicker(input);return;}
  const cal=e.target.closest&&e.target.closest('.glassCal');
  if(cal){
    e.preventDefault();
    const wheelItem=e.target.closest('[data-wheel-type][data-wheel-value]');
    const valueBtn=e.target.closest('[data-date-value]');
    const actionBtn=e.target.closest('[data-date-action]');
    if(wheelItem){setWheelValue(wheelItem.dataset.wheelType,wheelItem.dataset.wheelValue);return;}
    if(valueBtn){setDateInputValue(valueBtn.dataset.dateValue);closeDatePicker();return;}
    if(actionBtn){
      const action=actionBtn.dataset.dateAction;
      if(action==='toggle-wheel'){datePickerMode=datePickerMode==='wheel'?'grid':'wheel';renderDatePicker();return;}
      if(action==='wheel-done'){datePickerMode='grid';renderDatePicker();return;}
      if(action==='prev'||action==='next'){datePickerMonth=new Date(datePickerMonth.getFullYear(),datePickerMonth.getMonth()+(action==='next'?1:-1),1);renderDatePicker();return;}
      if(action==='today'){setDateInputValue(dateValue(new Date()));closeDatePicker();return;}
      if(action==='clear'){setDateInputValue('');closeDatePicker();return;}
    }
    return;
  }
  if(activeDateInput)closeDatePicker();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&activeDateInput)closeDatePicker();});
document.addEventListener('scroll',e=>{
  const col=e.target&&e.target.closest&&e.target.closest('.wheelCol');
  if(!col||!activeDateInput)return;
  clearTimeout(wheelScrollTimer);
  wheelScrollTimer=setTimeout(()=>settleWheelColumn(col),120);
},true);
window.addEventListener('resize',()=>{if(activeDateInput)renderDatePicker();});

function reminderText(c){if(c.isLongTerm)return '';if(c.reminderMode==='off')return '关闭';if(c.reminderMode==='custom')return `提前 ${c.reminderDaysBefore??3} 天`;return '跟随全局设置';}

    const rows=withBg.filter(c=>!q||[c.name,c.english,c.code].join(' ').toLowerCase().includes(q)).slice(0,400)
      .map(c=>`<div class="pkItem" data-asset="${c.bgAsset}"><img src="${esc(c.bgUrl)}" class="appicon" style="object-fit:cover"><div><div>${esc(c.name)}</div><div class="sub">${esc(c.english||c.code)}</div></div></div>`);
    dG('bgList').innerHTML=[head].concat(rows).join('');
    dG('bgList').querySelectorAll('.pkItem').forEach(el=>el.onclick=()=>{drawerData.cardBackgroundAssetName=el.dataset.asset;refreshBgRow();host.innerHTML='';});};
  dG('bgSearch').addEventListener('input',draw);dG('bgClose').onclick=()=>host.innerHTML='';
  host.querySelector('.scrim').onclick=e=>{if(e.target.classList.contains('scrim'))host.innerHTML='';};draw();
}

/* 运营商 App 图标选择(代后端 iTunes,按所选国家 storefront) */
async function openAppPicker(){
  const host=document.getElementById('pickerHost');
  host.innerHTML=`<div class="scrim picker"><div class="pickerBox"><div class="pickerHead"><b>选择运营商 App 图标</b><button class="iconbtn" id="apClose">✕</button></div>
    <input id="apSearch" placeholder="搜索运营商 App" value="${esc(drawerData.carrier||'')}" autofocus>
    <div class="pickerList" id="apList"><p class="sub" style="padding:20px;text-align:center">输入后回车搜索 · 结果来自 Apple iTunes Search API</p></div></div></div>`;
  const run=async()=>{const term=dG('apSearch').value.trim();if(!term)return;dG('apList').innerHTML='<p class="sub" style="padding:20px;text-align:center">搜索中…</p>';
    try{const r=await api('/api/appsearch?term='+encodeURIComponent(term)+'&country='+encodeURIComponent(drawerData.countryCode||'US'))||[];
      dG('apList').innerHTML=r.length?r.map((a,i)=>{const appIcon=safeImgURL(a.icon);return `<div class="pkItem" data-i="${i}">${appIcon?`<img src="${esc(appIcon)}" class="appicon">`:'<span class="appicon">🌐</span>'}<div><div>${esc(a.name)}</div><div class="sub">${esc(a.seller||'')}</div></div></div>`;}).join(''):'<p class="sub" style="padding:20px;text-align:center">没有找到匹配的 App,换个词或继续用国旗</p>';
      dG('apList').querySelectorAll('.pkItem').forEach(el=>el.onclick=()=>{const a=r[+el.dataset.i];drawerData.carrierAppName=a.name;drawerData.carrierAppIconURLString=a.icon;drawerData.carrierAppStoreURLString=a.url||'';refreshAppRow();host.innerHTML='';});
    }catch(e){dG('apList').innerHTML='<p class="sub" style="padding:20px;text-align:center">'+esc(e.message||'搜索失败')+'</p>';}};
  dG('apSearch').addEventListener('keydown',e=>{if(e.key==='Enter')run();});
  dG('apClose').onclick=()=>host.innerHTML='';host.querySelector('.scrim').onclick=e=>{if(e.target.classList.contains('scrim'))host.innerHTML='';};run();
}

/* 轮询 */
let lastVersion=0;
setInterval(async()=>{
  if(document.getElementById('app').classList.contains('hidden'))return;
  if(document.getElementById('drawerHost').innerHTML)return; // 编辑中不打断,避免手机端卡顿
  try{const s=await api('/api/status');updateKeeperStatus(s);
    if(s.dataVersion&&s.dataVersion!==lastVersion){if(lastVersion!==0)await loadCards();lastVersion=s.dataVersion;}}catch(e){}
},4000);

enterApp();
</script>
