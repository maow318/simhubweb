{% extends "base.html" %}
{% block title %}{% if card.id %}编辑卡片{% else %}添加卡片{% endif %} - SIMHUB Web{% endblock %}
{% block content %}
<section class="form-shell">
  <div class="form-heading">
    <p class="eyebrow">ESIMCardDTO</p>
    <h1>{% if card.id %}编辑卡片{% else %}添加卡片{% endif %}</h1>
  </div>

  <form method="post" class="form grid-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label>
      运营商
      <input name="carrier" value="{{ card.carrier }}" required placeholder="例如：SoftBank / Giffgaff / T-Mobile">
    </label>
    <label>
      套餐
      <input name="plan" value="{{ card.plan }}" placeholder="例如：30天无限流量 / 保号套餐">
    </label>
    <label>
      手机号
      <input name="phoneNumber" value="{{ card.phoneNumber }}" placeholder="+81 ...">
    </label>
    <label>
      国家代码
      <input name="countryCode" value="{{ card.countryCode }}" placeholder="JP / UK / US">
    </label>
    <label>
      国家/地区名称
      <input name="countryName" value="{{ card.countryName }}" placeholder="日本 / 英国 / 美国">
    </label>
    <label>
      旗帜
      <input name="flag" value="{{ card.flag or '🌐' }}" maxlength="8">
    </label>

    <label>
      价格
      <input name="price" value="{{ card.price }}" placeholder="550 JPY / 12.50 USD">
    </label>
    <label>
      币种
      <input name="currencyCode" value="{{ card.currencyCode or 'USD' }}" maxlength="8">
    </label>
    <label>
      当前余额
      <input name="currentBalance" value="{{ card.currentBalance or '' }}" placeholder="32.50 JPY">
    </label>
    <label>
      官网链接
      <input name="websiteURL" value="{{ card.websiteURL or '' }}" placeholder="https://...">
    </label>

    <label>
      开始日期
      <input name="activationDate" type="date" value="{{ date_input(card.activationDate) }}">
    </label>
    <label>
      到期日期
      <input name="expiryDate" type="date" value="{{ date_input(card.expiryDate) }}">
    </label>
    <label>
      续期周期（天）
      <input name="renewDays" type="number" min="1" value="{{ card.renewDays or 30 }}">
    </label>
    <label>
      续期单位
      <input name="renewalUnit" value="{{ card.renewalUnit or 'days' }}">
    </label>
    <label>
      续期间隔值
      <input name="renewalIntervalValue" type="number" min="1" value="{{ card.renewalIntervalValue or card.renewDays or 30 }}">
    </label>
    <label class="checkbox-label">
      <input name="isLongTerm" type="checkbox" {% if card.isLongTerm %}checked{% endif %}>
      长期保号
    </label>

    <label>
      SM-DP+ 地址
      <input name="smdpAddress" value="{{ card.smdpAddress }}">
    </label>
    <label>
      激活码
      <input name="activationCode" value="{{ card.activationCode }}">
    </label>
    <label>
      确认码
      <input name="confirmationCode" value="{{ card.confirmationCode or '' }}">
    </label>
    <label>
      EID
      <input name="eid" value="{{ card.eid }}">
    </label>

    <label>
      运营商 App 名称
      <input name="carrierAppName" value="{{ card.carrierAppName or '' }}">
    </label>
    <label>
      运营商 App 图标 URL
      <input name="carrierAppIconURLString" value="{{ card.carrierAppIconURLString or '' }}">
    </label>
    <label class="full">
      运营商 App Store URL
      <input name="carrierAppStoreURLString" value="{{ card.carrierAppStoreURLString or '' }}">
    </label>

    <label class="full">
      标签
      <input name="tags" value="{{ ', '.join(card.tags or []) }}" placeholder="保号卡, 日本卡, 主号">
    </label>
    <label class="full">
      流水记录
      <textarea name="transactionNotes" rows="4" placeholder="充值、扣费、保号动作记录">{{ card.transactionNotes or '' }}</textarea>
    </label>
    <label class="full">
      自定义提示词/备注
      <textarea name="customPrompt" rows="4" placeholder="保号方式、注意事项、PIN 等">{{ card.customPrompt or '' }}</textarea>
    </label>

    <div class="form-actions full">
      <button type="submit">保存</button>
      <a class="secondary-action" href="{{ url_for('dashboard') }}">取消</a>
    </div>
  </form>
</section>
{% endblock %}
