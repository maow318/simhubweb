<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SIMHUB Web{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="{{ url_for('dashboard') }}">SIMHUB Web</a>
      {% if g.user %}
        <nav class="nav">
          <a href="{{ url_for('dashboard') }}">卡片</a>
          <a href="{{ url_for('new_card') }}">添加</a>
          <a href="{{ url_for('export_json_page') }}">导出 JSON</a>
          <a href="{{ url_for('export_csv') }}">导出 CSV</a>
          <a href="{{ url_for('change_password') }}">密码</a>
          <form method="post" action="{{ url_for('logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="link-button" type="submit">退出</button>
          </form>
        </nav>
      {% endif %}
    </header>

    <main class="page">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-stack">
            {% for category, message in messages %}
              <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </main>
  </body>
</html>
