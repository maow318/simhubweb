services:
  simhub-keeper:
    build: .
    container_name: simhub-keeper
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./data:/data
    restart: unless-stopped

  simhub-reminders:
    build: .
    container_name: simhub-reminders
    command: python -m app.reminder_worker
    env_file:
      - .env
    environment:
      - REMINDER_SCAN_INTERVAL_SECONDS=${REMINDER_SCAN_INTERVAL_SECONDS:-3600}
    volumes:
      - ./data:/data
    restart: unless-stopped
    depends_on:
      - simhub-keeper
